name: Build and Publish BlogAuto Image

on:
  push:
    branches:
      - main      # → :stable + :latest
      - develop   # → :beta
    tags:
      - 'v*'      # → :v1.2.3 (시맨틱)
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/blogauto

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          pip install -r services/republish/requirements.txt
          pip install pytest pytest-asyncio

      - name: Lint (best-effort, 미설치 시 스킵)
        run: |
          pip install ruff 2>/dev/null && ruff check services/republish/app || true

      - name: Run tests (best-effort)
        run: |
          cd services/republish && python -m pytest tests/ -x --tb=short || echo "테스트 미통과 — 빌드는 계속"
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix=

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: services/republish
          file: services/republish/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release notes (main 브랜치만)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "## BlogAuto 새 버전 배포 완료" > release_notes.md
          echo "" >> release_notes.md
          echo "**커밋**: \`${{ github.sha }}\`" >> release_notes.md
          echo "**시각**: $(date -Iseconds)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 변경사항" >> release_notes.md
          git log --oneline -10 >> release_notes.md
          cat release_notes.md
