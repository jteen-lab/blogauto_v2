<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden"
     :data-blog-id="blog.id">

    <!-- 카드 헤더 -->
    <div class="px-4 py-2 flex items-center justify-between"
         :class="blog.platform === 'wordpress' ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'">
        <div class="flex items-center gap-2 flex-1 min-w-0">
            <!-- 플랫폼 아이콘 -->
            <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                 :class="blog.platform === 'wordpress' ? 'bg-blue-500' : 'bg-orange-500'">
                <span class="text-white font-medium text-xs" x-text="blog.platform === 'wordpress' ? 'WP' : 'BL'"></span>
            </div>
            <h4 class="font-semibold truncate" x-text="blog.name"></h4>
        </div>

        <div class="flex gap-1 flex-shrink-0">
            <!-- 수정 버튼 -->
            <button @click="openEditSheet(blog)"
                    class="p-1.5 text-gray-600 hover:text-accent hover:bg-accent-lt rounded-lg transition-colors"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <!-- 설정 버튼 -->
            <button @click="openSettingsSheet(blog)"
                    class="p-1.5 text-gray-600 hover:text-purple-700 hover:bg-purple-200/50 rounded-lg transition-colors"
                    title="설정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>

            <!-- 발행 동기화 버튼 -->
            <button @click="syncPublishedPosts(blog.id)"
                    :disabled="syncing === blog.id"
                    class="p-1.5 text-gray-600 hover:text-accent hover:bg-accent-lt rounded-lg transition-colors disabled:opacity-50"
                    title="발행 동기화">
                <svg x-show="syncing !== blog.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <svg x-show="syncing === blog.id" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>

            <!-- 테스트 버튼 -->
            <button @click="testConnection(blog.id)"
                    :disabled="testing === blog.id"
                    class="p-1.5 text-gray-600 hover:text-green-700 hover:bg-green-200/50 rounded-lg transition-colors disabled:opacity-50"
                    title="연결 테스트">
                <svg x-show="testing !== blog.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <svg x-show="testing === blog.id" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>

            <!-- 삭제 버튼 -->
            <button @click="deleteBlog(blog.id, blog.name)"
                    class="p-1.5 text-gray-600 hover:text-red-700 hover:bg-red-200/50 rounded-lg transition-colors"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 카드 본문 -->
    <div class="px-4 py-3">
        <!-- URL -->
        <div class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg mb-2 truncate">
            <a :href="blog.url" target="_blank" class="hover:text-accent" x-text="blog.url"></a>
        </div>

        <!-- 상태 뱃지 -->
        <div class="flex flex-wrap gap-1.5 mb-2">
            <!-- 자동 발행 뱃지 -->
            <span x-show="blog.auto_publish"
                  class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                자동 발행
            </span>

            <!-- 크롤링/매칭 상태 뱃지 (Phase M-1) -->
            <template x-if="blog.crawl_status === 'never'">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400 mr-1"></span>
                    연결 필요
                </span>
            </template>

            <template x-if="blog.crawl_status === 'crawling'">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-accent-lt text-accent">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1 animate-pulse"></span>
                    크롤링 중...
                </span>
            </template>

            <template x-if="blog.crawl_status === 'matching'">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-yellow-500 mr-1 animate-pulse"></span>
                    매칭 진행 중...
                </span>
            </template>

            <template x-if="blog.crawl_status === 'synced' && blog.is_new_blog">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-teal-100 text-teal-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-teal-500 mr-1"></span>
                    연결됨 (신규)
                </span>
            </template>

            <template x-if="blog.crawl_status === 'synced' && !blog.is_new_blog">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>
                    매칭 완료 (<span x-text="blog.matched_count"></span>/<span x-text="blog.crawled_count"></span>)
                </span>
            </template>

            <template x-if="blog.crawl_status === 'error'">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500 mr-1"></span>
                    연결 오류
                </span>
            </template>

            <!-- SEO 플러그인 뱃지 -->
            <span x-show="blog.seo_config?.detected_plugin"
                  class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
                SEO: <span x-text="(blog.seo_config?.detected_plugin || '').toUpperCase()"></span>
            </span>
        </div>

        <!-- 생성일 -->
        <div class="text-xs text-gray-400">
            <span x-text="formatDate(blog.created_at)"></span>
        </div>
    </div>
</div>
