{# 단일 방향 테두리 입력 매크로 #}
{% macro border_direction_input(direction, label, icon) %}
<div class="p-2 bg-gray-50 rounded border">
    <label class="block text-xs font-medium text-gray-600 mb-2">{{ icon }} {{ label }}</label>
    <div class="grid grid-cols-3 gap-2">
        <select x-model="currentStyles['border-{{ direction }}-style']"
                @change="updateStyle('border-{{ direction }}-style', $event.target.value)"
                class="px-2 py-1 text-xs border border-gray-300 rounded">
            <option value="">없음</option>
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
            <option value="dotted">Dotted</option>
        </select>
        <input type="number" x-model="currentStyles['border-{{ direction }}-width']"
               @input="updateStyle('border-{{ direction }}-width', $event.target.value)"
               placeholder="두께"
               class="px-2 py-1 text-xs border border-gray-300 rounded text-center">
        <div class="flex gap-1">
            <input type="color"
                   :value="hasColorValue(currentStyles['border-{{ direction }}-color']) ? currentStyles['border-{{ direction }}-color'] : '#cccccc'"
                   @input="updateStyle('border-{{ direction }}-color', $event.target.value)"
                   class="w-8 h-6 border border-gray-300 rounded cursor-pointer">
            <input type="text" x-model="currentStyles['border-{{ direction }}-color']"
                   @input="updateStyle('border-{{ direction }}-color', $event.target.value)"
                   placeholder="#ccc"
                   class="flex-1 px-1 py-1 text-xs border border-gray-300 rounded font-mono">
        </div>
    </div>
</div>
{% endmacro %}
