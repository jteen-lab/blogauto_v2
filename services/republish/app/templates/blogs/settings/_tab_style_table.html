<!--
  테이블 전용 스타일 편집 패널
  File: app/templates/blogs/settings/_tab_style_table.html
  Last-Updated: 2026-04-23

  styleTabApp() 컴포넌트 스코프 내에서 include 되어 사용.
  tableConfig, tableMode, onTableConfigChange(), applyTablePreset() 등 사용 가능.
-->
<div class="space-y-1 max-h-[500px] overflow-y-auto pr-1">

    <!-- 섹션 A: 테이블 프리셋 -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">테이블 프리셋</div>
        <div class="flex flex-wrap gap-2">
            <template x-for="[key, preset] in Object.entries(tablePresets)" :key="key">
                <button @click="applyTablePreset(key)"
                        class="flex-1 min-w-[70px] px-2 py-2 text-xs border rounded-lg hover:bg-gray-50 transition-colors text-center"
                        :class="key === 'dark' ? 'bg-gray-800 text-white border-gray-600 hover:bg-gray-700' : 'border-gray-200'">
                    <span x-text="preset.label" class="font-medium"></span>
                </button>
            </template>
        </div>
    </div>

    <!-- 섹션 B: 테두리 -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">테두리</div>
        <!-- 빠른 선택 버튼 -->
        <div class="flex gap-1 mb-3">
            <template x-for="bp in [{key:'none',label:'없음'},{key:'all',label:'전체'},{key:'horizontal',label:'가로선'},{key:'vertical',label:'세로선'},{key:'outline',label:'외곽선'}]" :key="bp.key">
                <button @click="tableConfig.borderPreset = bp.key; onTableConfigChange()"
                        class="flex-1 px-2 py-1.5 text-[10px] font-medium rounded border transition-colors"
                        :class="tableConfig.borderPreset === bp.key ? 'tab-active' : 'border-gray-200 text-gray-500 hover:bg-gray-50'"
                        x-text="bp.label"></button>
            </template>
        </div>
        <!-- 색상 + 두께 + 스타일 -->
        <div class="grid grid-cols-3 gap-2" x-show="tableConfig.borderPreset !== 'none'">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">색상</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.borderColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.borderColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">두께 (px)</label>
                <input type="number" x-model.number="tableConfig.borderWidth" @input="onTableConfigChange()"
                       min="1" max="5" class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">스타일</label>
                <select x-model="tableConfig.borderStyle" @change="onTableConfigChange()"
                        class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                    <option value="solid">실선</option>
                    <option value="dashed">파선</option>
                    <option value="dotted">점선</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 섹션 C: 헤더 (th) -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">헤더 (th)</div>
        <div class="grid grid-cols-2 gap-3 mb-2">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">배경색</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.thBgColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.thBgColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded" placeholder="transparent">
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">글자색</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.thTextColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.thTextColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                </div>
            </div>
        </div>
        <!-- 프리셋 팔레트 -->
        <div class="flex gap-1 mb-2">
            <template x-for="c in ['#f3f4f6','#dbeafe','#dcfce7','#fef3c7','#fce7f3','#e0e7ff','#f3e8ff','#1f2937']" :key="c">
                <button @click="tableConfig.thBgColor = c; onTableConfigChange()"
                        class="w-5 h-5 rounded border border-gray-300 cursor-pointer hover:scale-110 transition-transform"
                        :style="`background-color:${c}`"></button>
            </template>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">굵기</label>
                <select x-model="tableConfig.thFontWeight" @change="onTableConfigChange()"
                        class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                    <option value="normal">Normal</option>
                    <option value="500">Medium</option>
                    <option value="600">Semi Bold</option>
                    <option value="bold">Bold</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">패딩</label>
                <input type="range" x-model.number="tableConfig.thPadding" @input="onTableConfigChange()"
                       min="4" max="16" step="2" class="w-full">
                <div class="flex justify-between text-[9px] text-gray-400">
                    <span>컴팩트</span>
                    <span x-text="tableConfig.thPadding + 'px'"></span>
                    <span>여유</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 섹션 D: 데이터 셀 (td) -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">데이터 셀 (td)</div>
        <div class="grid grid-cols-2 gap-3 mb-2">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">배경색</label>
                <div class="flex items-center gap-1">
                    <input type="color"
                           :value="tableConfig.tdBgColor || '#ffffff'"
                           @input="tableConfig.tdBgColor = $event.target.value; onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.tdBgColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded" placeholder="transparent">
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">글자색</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.tdTextColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.tdTextColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                </div>
            </div>
        </div>
        <div>
            <label class="block text-[10px] text-gray-400 mb-1">패딩</label>
            <input type="range" x-model.number="tableConfig.tdPadding" @input="onTableConfigChange()"
                   min="4" max="16" step="2" class="w-full">
            <div class="flex justify-between text-[9px] text-gray-400">
                <span>컴팩트</span>
                <span x-text="tableConfig.tdPadding + 'px'"></span>
                <span>여유</span>
            </div>
        </div>
    </div>

    <!-- 섹션 E: 행 교대 색상 (Zebra Striping) -->
    <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">행 교대 색상</div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" x-model="tableConfig.zebraEnabled" @change="onTableConfigChange()" class="sr-only peer">
                <div class="w-8 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
        </div>
        <div x-show="tableConfig.zebraEnabled" class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">짝수 행</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.zebraEvenColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.zebraEvenColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                </div>
            </div>
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">홀수 행</label>
                <div class="flex items-center gap-1">
                    <input type="color" x-model="tableConfig.zebraOddColor" @input="onTableConfigChange()"
                           class="w-6 h-6 rounded cursor-pointer border-0">
                    <input type="text" x-model="tableConfig.zebraOddColor" @input="onTableConfigChange()"
                           class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
                </div>
            </div>
        </div>
    </div>

    <!-- 섹션 F: 테이블 레이아웃 -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">테이블 레이아웃</div>
        <!-- 너비 -->
        <div class="mb-3">
            <label class="block text-[10px] text-gray-400 mb-1">너비</label>
            <div class="flex items-center gap-3">
                <label class="flex items-center gap-1 text-[10px] text-gray-600 cursor-pointer">
                    <input type="radio" x-model="tableConfig.tableWidth" value="auto" @change="onTableConfigChange()"
                           class="w-3 h-3 text-accent">
                    auto
                </label>
                <label class="flex items-center gap-1 text-[10px] text-gray-600 cursor-pointer">
                    <input type="radio" x-model="tableConfig.tableWidth" value="100%" @change="onTableConfigChange()"
                           class="w-3 h-3 text-accent">
                    100%
                </label>
                <label class="flex items-center gap-1 text-[10px] text-gray-600 cursor-pointer">
                    <input type="radio" x-model="tableConfig.tableWidth" value="custom" @change="onTableConfigChange()"
                           class="w-3 h-3 text-accent">
                    직접입력
                </label>
                <input x-show="tableConfig.tableWidth === 'custom'"
                       type="text" x-model="tableConfig.tableWidthCustom" @input="onTableConfigChange()"
                       placeholder="예: 80%, 600px"
                       class="flex-1 text-[10px] px-1.5 py-1 border border-gray-200 rounded">
            </div>
        </div>
        <!-- 테두리 합침 -->
        <div class="flex items-center justify-between mb-3">
            <div>
                <label class="block text-[10px] text-gray-400">테두리 합침</label>
                <span class="text-[9px] text-gray-300" x-text="tableConfig.borderCollapse === 'collapse' ? '테두리 겹침' : '테두리 분리'"></span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox"
                       :checked="tableConfig.borderCollapse === 'collapse'"
                       @change="tableConfig.borderCollapse = $event.target.checked ? 'collapse' : 'separate'; onTableConfigChange()"
                       class="sr-only peer">
                <div class="w-8 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-500"></div>
            </label>
        </div>
        <!-- 테두리 간격 (separate 모드에서만) -->
        <div x-show="tableConfig.borderCollapse === 'separate' && (parseInt(tableConfig.borderRadius) || 0) === 0">
            <label class="block text-[10px] text-gray-400 mb-1">테두리 간격 (px)</label>
            <input type="number" x-model="tableConfig.borderSpacing" @input="onTableConfigChange()"
                   min="0" max="20" class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
        </div>
    </div>

    <!-- 섹션 G: 표 고급 (P4) -->
    <div class="mb-4">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">표 고급</div>
        <div class="grid grid-cols-2 gap-3">
            <!-- 모서리 둥글기 -->
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">모서리 둥글기 (px)</label>
                <input type="number" x-model.number="tableConfig.borderRadius" @input="onTableConfigChange()"
                       min="0" max="24" placeholder="0"
                       class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
            </div>
            <!-- 첫 열 너비 -->
            <div>
                <label class="block text-[10px] text-gray-400 mb-1">첫 열 너비 (예: 35%)</label>
                <input type="text" x-model="tableConfig.firstColWidth" @input="onTableConfigChange()"
                       placeholder="비우면 자동"
                       class="w-full text-[10px] px-1.5 py-1 border border-gray-200 rounded">
            </div>
        </div>
        <p class="text-[9px] text-gray-300 mt-1" x-show="(parseInt(tableConfig.borderRadius) || 0) > 0">
            둥근 모서리 사용 시 테두리 분리 모드로 자동 전환됩니다.
        </p>
    </div>

</div>
