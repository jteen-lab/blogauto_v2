{#
  블로그 행 액션 — 카드(_card.html)에서 쓰던 마크업을 그대로 옮긴 것.

  컴포넌트가 액션을 대신 그리게 했더니 하단시트가 열리지 않았다. 원인을
  브라우저 없이 특정할 수 없어, **동작이 검증된 직접 호출**로 되돌린다.
  `@click="openEditSheet(blog)"` 는 카드에서 문제없이 동작하던 형태다.

  공용 표 컴포넌트는 이 파일을 include 만 한다(actions_include 변수).
  화면마다 액션이 다르므로 화면이 자기 마크업을 주는 편이 자연스럽고,
  컴포넌트는 여전히 재사용된다.
#}
<div class="inline-flex items-center gap-0.5">
  <button type="button" @click="openEditSheet(blog)"
          class="p-1.5 text-gray-500 hover:text-accent hover:bg-accent-lt rounded-lg transition-colors"
          title="수정">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
    </svg>
  </button>

  <button type="button" @click="openSettingsSheet(blog)"
          class="p-1.5 text-gray-500 hover:text-purple-700 hover:bg-purple-100 rounded-lg transition-colors"
          title="설정">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
  </button>

  <button type="button" @click="syncPublishedPosts(blog.id)"
          :disabled="syncing === blog.id"
          class="p-1.5 text-gray-500 hover:text-accent hover:bg-accent-lt rounded-lg transition-colors disabled:opacity-50"
          title="발행 동기화">
    <svg x-show="syncing !== blog.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    <svg x-show="syncing === blog.id" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
  </button>

  <button type="button" @click="testConnection(blog.id)"
          :disabled="testing === blog.id"
          class="p-1.5 text-gray-500 hover:text-green-700 hover:bg-green-100 rounded-lg transition-colors disabled:opacity-50"
          title="연결 테스트">
    <svg x-show="testing !== blog.id" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
    </svg>
    <svg x-show="testing === blog.id" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
  </button>

  <button type="button" @click="deleteBlog(blog.id, blog.name)"
          class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          title="삭제">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
  </button>
</div>
