{#
  플로우 행 액션 — 카드(_card.html) 헤더 버튼 3개를 그대로 옮긴 것.

  카드에서는 중첩 x-data 안이라 window.flowListApp 을 거쳤지만, 표에서는
  같은 컴포넌트 안이므로 직접 호출한다. 블로그에서 컴포넌트가 액션을
  대신 그리게 했다가 하단시트가 열리지 않는 사고가 있었다.
#}
<div class="inline-flex items-center gap-0.5">
  <button type="button" @click="editFlow(flow.id)"
          class="p-1.5 text-gray-500 hover:text-accent hover:bg-accent-lt rounded-lg transition-colors"
          title="수정">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
    </svg>
  </button>

  <button type="button" @click="copyFlow(flow.id)"
          class="p-1.5 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
          title="복사">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    </svg>
  </button>

  <button type="button" @click="deleteFlow(flow.id)"
          class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          title="삭제">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
  </button>
</div>
