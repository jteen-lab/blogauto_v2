<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden"
     :data-flow-id="flow.id"
     :id="'flow-card-' + flow.id"
     x-data="flowCardState()"
     x-init="initCard($el)">

    <!-- 카드 헤더 -->
    <div class="px-4 py-2 flex items-center justify-between text-gray-700 bg-blue-100">
        <div class="flex-1 min-w-0">
            <h4 class="font-semibold truncate" x-text="flow.name"></h4>
        </div>

        <div class="flex gap-1 flex-shrink-0">
            <!-- 실행 버튼 -->
            <button @click.stop="window.flowListApp?.executeFlow(flow.id)"
                    class="p-1.5 text-green-600 hover:text-green-800 hover:bg-green-100/50 rounded-lg transition-colors"
                    title="1회 실행 (테스트)"
                    :disabled="window.flowListApp?.executingFlowId === flow.id">
                <template x-if="window.flowListApp?.executingFlowId === flow.id">
                    <svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </template>
                <template x-if="window.flowListApp?.executingFlowId !== flow.id">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </template>
            </button>

            <button @click="window.flowListApp?.editFlow(flow.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <button @click="window.flowListApp?.copyFlow(flow.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="복사">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>

            <button @click="window.flowListApp?.deleteFlow(flow.id)"
                    class="p-1.5 text-gray-600 hover:text-red-700 hover:bg-red-200/50 rounded-lg transition-colors"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 카드 본문 -->
    <div class="px-4 py-3" x-data="{
        expanded: false,
        maxVisible: 3,
        get allRows() {
            const rows = [];
            // 모듈 행 추가 (순서대로)
            getFlowModules(flow).forEach(m => rows.push({ type: 'module', data: m }));
            // 블로그 행 추가 (항상 마지막)
            if (getFlowBlogs(flow).length > 0) {
                rows.push({ type: 'blog', data: getFlowBlogs(flow) });
            }
            return rows;
        },
        get hiddenCount() {
            return Math.max(0, this.allRows.length - this.maxVisible);
        }
    }">
        <!-- 설명 -->
        <div x-show="flow.description" class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg mb-3">
            <span x-text="flow.description"></span>
        </div>

        <!-- 통합 행 렌더링 (모듈 + 블로그) -->
        <div class="mb-3">
            <div class="flex items-center mb-2">
                <span class="text-xs font-medium text-gray-700">
                    모듈 : <span x-text="getFlowModules(flow).length"></span>개 / 블로그 : <span x-text="getFlowBlogs(flow).length"></span>개
                </span>
            </div>

            <!-- 행이 있는 경우: 통합 목록 -->
            <template x-if="allRows.length > 0">
                <div class="module-slide-list">
                    <template x-for="(row, rowIndex) in allRows" :key="rowIndex">
                        <!-- 행 표시 조건: 확장됨 OR 인덱스 < maxVisible -->
                        <div x-show="expanded || rowIndex < maxVisible" x-transition>

                            <!-- 모듈 행 -->
                            <template x-if="row.type === 'module'">
                                <div class="module-slide-row"
                                     :class="'type-' + row.data.module.module_type.code"
                                     @touchstart="toggleSlideTouch($event, $el)"
                                     x-init="$nextTick(() => initSlideCheck($el))">

                                    <!-- 모듈 라벨 (고정 - 1/3 비율) -->
                                    <div class="module-slide-label">
                                        <span class="module-slide-icon" x-text="getModuleIcon(row.data.module.module_type.code)"></span>
                                        <span class="module-slide-name" x-text="row.data.module.name" :title="row.data.module.name"></span>
                                    </div>

                                    <!-- 슬라이드 정보 영역 (2/3 비율) -->
                                    <div class="module-slide-container">
                                        <div class="module-slide-track no-slide"
                                             :style="{ '--slide-duration': getModuleSlideDuration(row.data.module) + 's' }">

                                            <!-- 원본 정보 -->
                                            <template x-for="(info, i) in getModuleInfoItems(row.data.module)" :key="'orig-' + i">
                                                <span class="slide-info-item">
                                                    <span class="slide-info-label" x-text="info.label + ':'"></span>
                                                    <span class="slide-info-value" x-text="info.value"></span>
                                                </span>
                                            </template>

                                            <!-- 구분자 (항상 렌더링, CSS로 제어) -->
                                            <span class="slide-cycle-separator">◆</span>

                                            <!-- 복제 정보 (항상 렌더링, CSS로 제어) -->
                                            <template x-for="(info, i) in getModuleInfoItems(row.data.module)" :key="'dup-' + i">
                                                <span class="slide-info-item" aria-hidden="true">
                                                    <span class="slide-info-label" x-text="info.label + ':'"></span>
                                                    <span class="slide-info-value" x-text="info.value"></span>
                                                </span>
                                            </template>
                                        </div>
                                        <span class="slide-pause-hint">⏸</span>
                                    </div>
                                </div>
                            </template>

                            <!-- 블로그 행 -->
                            <template x-if="row.type === 'blog'">
                                <div class="blog-slide-section"
                                     @touchstart="toggleSlideTouch($event, $el)"
                                     x-init="$nextTick(() => initBlogSlideCheck($el, row.data.length))">
                                    <!-- 블로그 라벨 -->
                                    <div class="blog-slide-label">
                                        <span class="blog-slide-icon">📝</span>
                                        <span class="blog-slide-count">블로그</span>
                                    </div>

                                    <!-- 슬라이드 영역 -->
                                    <div class="blog-slide-container">
                                        <div class="blog-slide-track no-slide"
                                             :style="{ '--blog-slide-duration': getBlogSlideDuration(row.data.length) + 's' }">

                                            <!-- 원본 블로그 목록 -->
                                            <template x-for="(flowBlog, i) in row.data" :key="'blog-orig-' + flowBlog.id">
                                                <span class="blog-slide-item">
                                                    <span class="blog-platform-badge"
                                                          :class="flowBlog.blog.platform === 'wordpress' ? 'blog-platform-wp' : 'blog-platform-bl'"
                                                          x-text="flowBlog.blog.platform === 'wordpress' ? 'WP' : 'BL'"></span>
                                                    <span class="blog-slide-name" x-text="flowBlog.blog.name"></span>
                                                    <span x-show="i < row.data.length - 1" class="blog-slide-separator">·</span>
                                                </span>
                                            </template>

                                            <!-- 구분자 (항상 렌더링, CSS로 제어) -->
                                            <span class="slide-cycle-separator">◆</span>

                                            <!-- 복제 블로그 목록 (항상 렌더링, CSS로 제어) -->
                                            <template x-for="(flowBlog, i) in row.data" :key="'blog-dup-' + flowBlog.id">
                                                <span class="blog-slide-item" aria-hidden="true">
                                                    <span class="blog-platform-badge"
                                                          :class="flowBlog.blog.platform === 'wordpress' ? 'blog-platform-wp' : 'blog-platform-bl'"
                                                          x-text="flowBlog.blog.platform === 'wordpress' ? 'WP' : 'BL'"></span>
                                                    <span class="blog-slide-name" x-text="flowBlog.blog.name"></span>
                                                    <span x-show="i < row.data.length - 1" class="blog-slide-separator">·</span>
                                                </span>
                                            </template>
                                        </div>
                                        <span class="blog-pause-hint">⏸</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <!-- 모듈과 블로그 모두 없음 -->
            <div x-show="getFlowModules(flow).length === 0 && getFlowBlogs(flow).length === 0" class="module-empty-state">
                연결된 모듈이 없습니다
            </div>
        </div>

        <!-- 더보기/접기 버튼 (통합 행 기준) -->
        <button x-show="hiddenCount > 0"
                @click="expanded = !expanded; if(expanded) { $nextTick(() => reinitSlides($el.closest('.px-4'))) }"
                class="card-expand-btn">
            <span x-text="expanded ? '접기 ▲' : `더보기 (${hiddenCount}개 더) ▼`"></span>
        </button>
    </div>
</div>
