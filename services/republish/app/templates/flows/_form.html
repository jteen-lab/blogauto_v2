<!--
플로우 생성/수정 폼 템플릿
모듈 관리 폼 스타일 계승
-->

<div x-data="flowFormData()" x-init="init()">
<form id="flowFormElement" @submit.prevent="submitForm()">
    <!-- 플로우 기본 정보 -->
    <div class="space-y-6">

        <!-- 플로우 이름 -->
        <div>
            <label for="flow_name" class="block text-sm font-medium text-gray-700 mb-2">
                플로우 이름 <span class="text-red-500">*</span>
            </label>
            <input type="text"
                   id="flow_name"
                   name="name"
                   x-model="formData.name"
                   required
                   maxlength="100"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"
                   placeholder="플로우를 구분할 수 있는 이름을 입력하세요">
            <p class="mt-1 text-xs text-gray-500">
                플로우를 구분할 수 있는 이름을 입력하세요
            </p>
        </div>

        <!-- 플로우 설명 -->
        <div>
            <label for="flow_description" class="block text-sm font-medium text-gray-700 mb-2">
                설명 (선택)
            </label>
            <textarea id="flow_description"
                      name="description"
                      x-model="formData.description"
                      rows="3"
                      maxlength="500"
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent resize-none"
                      placeholder="플로우에 대한 설명을 입력하세요 (선택사항)"></textarea>
            <div class="mt-1 flex justify-between items-center">
                <p class="text-xs text-gray-500">
                    플로우의 목적이나 사용법을 간단히 설명하세요
                </p>
                <span class="text-xs text-gray-400"
                      x-text="`${(formData.description || '').length}/500`"></span>
            </div>
        </div>

        <!-- GP 배지 -->
        <template x-if="flowHasGP">
            <div class="px-3 py-1.5 bg-gradient-to-r from-emerald-50 to-blue-50 border border-emerald-200 rounded-lg text-sm mb-4">
                <span class="font-medium text-emerald-800">📈 성장 전략 적용됨</span>
                <span class="text-emerald-600 ml-2" x-text="gpModuleName"></span>
            </div>
        </template>

        <!-- 모듈 선택 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">
                📦 포함할 모듈 선택 (선택)
            </label>

            <div class="border border-gray-200 rounded-lg">
                {# 모듈 탭 — 수집·대량 수집은 없앴다(alembic 073/074).
                   모듈 타입이 사라져 탭을 눌러도 늘 비어 있었다. #}
                <div class="flex border-b border-gray-200 overflow-x-auto">
                    <button type="button"
                            @click="activeModuleTab = 'prompt_generate'"
                            :class="activeModuleTab === 'prompt_generate' ? 'tab-active' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        📝✨ 프롬프트/생성
                        <span x-show="getSelectedCountByTypes(['prompt','generate']) > 0"
                              x-text="getSelectedCountByTypes(['prompt','generate'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                    <button type="button"
                            @click="activeModuleTab = 'keyword'"
                            :class="activeModuleTab === 'keyword' ? 'bg-amber-50 text-amber-700 border-amber-500' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        키워드
                        <span x-show="getSelectedCountByTypes(['keyword']) > 0"
                              x-text="getSelectedCountByTypes(['keyword'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                    <button type="button"
                            @click="activeModuleTab = 'title_gen'"
                            :class="activeModuleTab === 'title_gen' ? 'bg-sky-50 text-sky-700 border-sky-500' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        제목
                        <span x-show="getSelectedCountByTypes(['title_gen']) > 0"
                              x-text="getSelectedCountByTypes(['title_gen'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                    <button type="button"
                            @click="activeModuleTab = 'data'"
                            :class="activeModuleTab === 'data' ? 'bg-teal-50 text-teal-700 border-teal-500' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        데이터
                        <span x-show="getSelectedCountByTypes(['data']) > 0"
                              x-text="getSelectedCountByTypes(['data'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                    <button type="button"
                            @click="activeModuleTab = 'growth_profile'"
                            :class="activeModuleTab === 'growth_profile' ? 'bg-emerald-50 text-emerald-700 border-emerald-500' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        성장 프로파일
                        <span x-show="getSelectedCountByTypes(['growth_profile']) > 0"
                              x-text="getSelectedCountByTypes(['growth_profile'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                    <button type="button"
                            @click="activeModuleTab = 'contact_form'"
                            :class="activeModuleTab === 'contact_form' ? 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-500' : 'bg-white text-gray-500 hover:text-gray-700'"
                            class="flex-1 px-3 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap min-w-0">
                        📋 필수구성
                        <span x-show="getSelectedCountByTypes(['contact_form']) > 0"
                              x-text="getSelectedCountByTypes(['contact_form'])"
                              class="ml-1 px-1.5 py-0.5 text-xs bg-primary text-white rounded-full"></span>
                    </button>
                </div>

                <div class="p-4 max-h-96 overflow-y-auto">
                    <div x-show="modulesLoading" class="flex items-center justify-center py-8">
                        <svg class="animate-spin h-5 w-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-sm text-gray-500">모듈 목록을 불러오는 중...</span>
                    </div>

                    <div x-show="!modulesLoading && getModulesByType(activeModuleTab).length > 0"
                         class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
                        <template x-for="module in getModulesByType(activeModuleTab)" :key="module.id">
                            {% include 'flows/_module_select_card.html' %}
                        </template>
                    </div>

                    <div x-show="!modulesLoading && getModulesByType(activeModuleTab).length === 0"
                         class="text-center py-8 text-gray-500">
                        <span class="text-2xl mb-2 block" x-text="getModuleIcon(activeModuleTab)"></span>
                        <p class="text-sm">생성된 <span x-text="getModuleTypeName(activeModuleTab)"></span> 모듈이 없습니다</p>
                    </div>
                </div>
            </div>

            <div x-show="formData.selectedModules.length > 0" class="mt-2 text-xs text-primary">
                <span x-text="formData.selectedModules.length"></span>개 모듈이 선택되었습니다
            </div>
        </div>

        <!-- 블로그 선택 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">
                📝 포함할 블로그 선택 (선택)
            </label>

            <!-- 프롬프트 모듈 블로그 자동 연동 안내 -->
            <template x-if="promptLinkedBlogIds.length > 0">
                <div class="mb-3 px-3 py-2 bg-green-50 border border-green-200 rounded-lg text-sm">
                    <span class="text-green-800 font-medium">📝 프롬프트 모듈 연동</span>
                    <span class="text-green-600 ml-1">
                        프롬프트 모듈에 연결된 블로그
                        <span x-text="promptLinkedBlogIds.length"></span>개가 자동 선택되었습니다
                    </span>
                </div>
            </template>

            <div class="border border-gray-200 rounded-lg">
                <div class="p-4 max-h-96 overflow-y-auto">
                    <div x-show="blogsLoading" class="flex items-center justify-center py-8">
                        <svg class="animate-spin h-5 w-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-sm text-gray-500">블로그 목록을 불러오는 중...</span>
                    </div>

                    <div x-show="!blogsLoading && blogs.length > 0"
                         class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-3">
                        <template x-for="blog in blogs" :key="blog.id">
                            {% include 'flows/_blog_select_card.html' %}
                        </template>
                    </div>

                    <div x-show="!blogsLoading && blogs.length === 0"
                         class="text-center py-8 text-gray-500">
                        <span class="text-2xl mb-2 block">🌐</span>
                        <p class="text-sm">등록된 블로그가 없습니다</p>
                    </div>
                </div>
            </div>

            <div x-show="formData.selectedBlogs.length > 0" class="mt-2 text-xs text-primary">
                <span x-text="formData.selectedBlogs.length"></span>개 블로그가 선택되었습니다
            </div>
        </div>

    </div>

    <!-- 폼 하단 버튼들 -->
    <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="flex gap-3">
            <button type="button"
                    onclick="closeBottomSheet('flowForm')"
                    class="flex-1 py-3 px-4 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors font-medium">
                취소
            </button>
            <button type="submit"
                    :disabled="!isFormValid()"
                    class="flex-1 py-3 px-4 text-white rounded-lg font-medium transition-colors"
                    :class="isFormValid() ? 'btn-primary' : 'bg-gray-400 cursor-not-allowed'">
                <span x-show="!saving">
                    <span x-text="isEditMode ? '수정' : '생성'"></span>
                </span>
                <span x-show="saving" class="flex items-center justify-center gap-2">
                    <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="isEditMode ? '수정 중...' : '생성 중...'"></span>
                </span>
            </button>
        </div>
    </div>

    <!-- 숨겨진 필드 -->
    <input type="hidden" id="flow_id" name="id" x-model="formData.id">
</form>

<!-- 알림 메시지 -->
<div x-show="message.text"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 transform translate-y-2"
     x-transition:enter-end="opacity-100 transform translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform translate-y-2"
     class="fixed top-4 right-4 z-[9999] max-w-sm"
     x-init="$watch('message.text', (value) => {
         if (value && message.type !== 'error') {
             setTimeout(() => { message.text = ''; }, 5000);
         }
     })">

    <div class="bg-white rounded-lg shadow-lg border-l-4 p-4"
         :class="{
             'border-green-400 bg-green-50': message.type === 'success',
             'border-red-400 bg-red-50': message.type === 'error',
             'border-primary bg-primary-lt': message.type === 'info'
         }">

        <div class="flex items-start">
            <div class="flex-shrink-0">
                <div x-show="message.type === 'success'"
                     class="w-5 h-5 text-green-400">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div x-show="message.type === 'error'"
                     class="w-5 h-5 text-red-400">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div x-show="message.type === 'info'"
                     class="w-5 h-5 text-primary">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                </div>
            </div>

            <div class="ml-3 flex-1">
                <p class="text-sm font-medium"
                   :class="{
                       'text-green-800': message.type === 'success',
                       'text-red-800': message.type === 'error',
                       'text-primary': message.type === 'info'
                   }"
                   x-text="message.text"></p>
            </div>

            <button @click="message.text = ''"
                    class="ml-4 text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>
</div></div>
