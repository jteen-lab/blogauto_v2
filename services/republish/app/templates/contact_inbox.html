{% extends "base.html" %}

{% block title %}문의 수신함 - BlogAuto V2{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-6" x-data="contactInbox()" x-init="load()">
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
            📨 문의 수신함
            <span x-show="unread > 0" class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full"
                  x-text="unread + ' 미읽음'"></span>
        </h1>
        <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 flex items-center gap-1">
                <input type="checkbox" x-model="unreadOnly" @change="load()"> 미읽음만
            </label>
            <button @click="sync()" :disabled="syncing"
                    class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700 disabled:opacity-50">
                <span x-show="!syncing">🔄 Tally에서 새 문의 가져오기</span>
                <span x-show="syncing">가져오는 중...</span>
            </button>
        </div>
    </div>

    <p class="text-xs text-gray-500 mb-3" x-show="syncMsg" x-text="syncMsg"></p>

    <div x-show="!loading && items.length === 0" class="p-8 text-center text-gray-400 border border-dashed rounded-lg">
        문의가 없습니다. "새 문의 가져오기"로 Tally 제출을 동기화하세요.
    </div>

    <div class="space-y-3">
        <template x-for="s in items" :key="s.id">
            <div class="border rounded-lg p-4"
                 :class="s.is_read ? 'bg-white border-gray-200' : 'bg-purple-50/40 border-purple-200'">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span x-show="!s.is_read" class="w-2 h-2 bg-purple-500 rounded-full"></span>
                        <span class="font-medium text-gray-900" x-text="s.blog_name"></span>
                        <span class="text-xs text-gray-400" x-text="s.form_name"></span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500" x-text="fmtDate(s.submitted_at)"></span>
                        <button @click="toggleRead(s)" class="text-xs text-purple-600 hover:underline"
                                x-text="s.is_read ? '안읽음 표시' : '읽음 표시'"></button>
                    </div>
                </div>
                <div class="space-y-1">
                    <template x-for="f in s.fields" :key="f.label">
                        <div class="text-sm flex gap-2">
                            <span class="text-gray-500 min-w-[80px]" x-text="f.label"></span>
                            <span class="text-gray-900 whitespace-pre-wrap" x-text="f.value || '-'"></span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function contactInbox() {
    return {
        items: [], unread: 0, unreadOnly: false, loading: false, syncing: false, syncMsg: '',
        async load() {
            this.loading = true;
            try {
                const r = await fetch('/api/v1/contact-submissions?unread_only=' + this.unreadOnly, { credentials: 'include' });
                if (r.ok) { const d = await r.json(); this.items = d.items || []; this.unread = d.unread_count || 0; }
            } catch (e) { console.error(e); } finally { this.loading = false; }
        },
        async sync() {
            this.syncing = true; this.syncMsg = '';
            try {
                const r = await fetch('/api/v1/contact-submissions/sync', { method: 'POST', credentials: 'include' });
                const d = await r.json();
                this.syncMsg = d.success ? ('동기화 완료 · 새 문의 ' + (d.new || 0) + '건') : ('동기화 실패: ' + (d.message || ''));
                await this.load();
            } catch (e) { this.syncMsg = '동기화 오류'; } finally { this.syncing = false; }
        },
        async toggleRead(s) {
            try {
                const r = await fetch('/api/v1/contact-submissions/' + s.id + '/read?is_read=' + (!s.is_read), { method: 'POST', credentials: 'include' });
                if (r.ok) { s.is_read = !s.is_read; this.unread += s.is_read ? -1 : 1; }
            } catch (e) { console.error(e); }
        },
        fmtDate(v) { if (!v) return ''; try { return new Date(v).toLocaleString('ko-KR'); } catch (e) { return v; } }
    };
}
</script>
{% endblock %}
