<!-- 글로벌 요약탭 컴포넌트 -->
<div x-data="globalSummary()" x-init="init()" class="bg-white border-b border-gray-200 shadow-sm relative">
    <!-- 고정 요약탭 바 (가운데 정렬) -->
    <div class="max-w-7xl mx-auto px-4 py-3">
        <div class="flex items-center gap-2">
            <!-- 요약탭 클릭 영역 -->
            <div @click="togglePanel()" class="flex-1 cursor-pointer hover:bg-gray-50 rounded-lg transition-colors">
                <!-- PC: 가로 1행 정렬 -->
                <div class="hidden md:flex items-center justify-center gap-4 overflow-x-auto scrollbar-hide py-1">
                    <template x-for="tab in pinnedTabs" :key="tab.key">
                        <div class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 whitespace-nowrap shadow-sm"
                             :class="tab.bgClass">
                            <span class="text-sm font-medium" :class="tab.textClass" x-text="tab.label"></span>
                            <span class="font-bold text-xl" :class="tab.textClass"
                                  x-text="stats[tab.key] ?? '-'"></span>
                        </div>
                    </template>
                    <template x-if="pinnedTabs.length === 0">
                        <div class="text-gray-400 text-sm py-2">클릭하여 요약 보기</div>
                    </template>
                </div>
                <!-- 모바일: 2열 그리드 -->
                <div class="md:hidden grid grid-cols-2 gap-2">
                    <template x-for="tab in pinnedTabs" :key="tab.key">
                        <div class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 shadow-sm"
                             :class="tab.bgClass">
                            <span class="text-xs font-medium truncate" :class="tab.textClass" x-text="tab.label"></span>
                            <span class="font-bold text-lg flex-shrink-0" :class="tab.textClass"
                                  x-text="stats[tab.key] ?? '-'"></span>
                        </div>
                    </template>
                    <template x-if="pinnedTabs.length === 0">
                        <div class="col-span-2 text-center text-gray-400 text-sm py-2">클릭하여 요약 보기</div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- 상단 슬라이드 다운 패널 -->
    <div x-show="panelOpen"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="-translate-y-full"
         x-transition:enter-end="translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-y-0"
         x-transition:leave-end="-translate-y-full"
         x-cloak
         class="fixed inset-x-0 top-0 z-50 bg-white shadow-2xl"
         style="height: 100vh; max-height: 100vh;">

        <!-- 패널 헤더 -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 bg-white sticky top-0">
            <h3 class="text-lg font-bold text-gray-900">대시보드 요약</h3>
            <div class="flex items-center gap-2">
                <!-- 설정 버튼 (사용자/AI/API 설정) -->
                <button @click.stop="openSettingsModal()"
                        class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors"
                        title="설정">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
                <!-- 닫기 버튼 -->
                <button @click="closePanel()"
                        class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 패널 콘텐츠 -->
        <div class="overflow-y-auto" style="height: calc(100vh - 60px);">
            <div class="max-w-5xl mx-auto px-4 py-6">
                <!-- 블로그 섹션 -->

                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'blog')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-blue-100 ring-2 ring-blue-500 shadow-md' : 'bg-blue-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-blue-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-blue-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 카테고리 섹션 -->
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-green-600 mb-3 uppercase tracking-wide">카테고리</h4>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'category')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-green-100 ring-2 ring-green-500 shadow-md' : 'bg-green-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-green-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-green-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 모듈 섹션 -->
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-purple-600 mb-3 uppercase tracking-wide">모듈</h4>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'module')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-purple-100 ring-2 ring-purple-500 shadow-md' : 'bg-purple-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-purple-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-purple-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 플로우 섹션 -->
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-cyan-600 mb-3 uppercase tracking-wide">플로우</h4>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'flow')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-cyan-100 ring-2 ring-cyan-500 shadow-md' : 'bg-cyan-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-cyan-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-cyan-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 이번 주 통계 섹션 -->
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-orange-600 mb-3 uppercase tracking-wide">이번 주</h4>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'week')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-orange-100 ring-2 ring-orange-500 shadow-md' : 'bg-orange-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-orange-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-orange-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 오늘 통계 섹션 -->
                <div class="mb-6">
                    <h4 class="text-sm font-bold text-red-600 mb-3 uppercase tracking-wide">오늘</h4>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <template x-for="tab in allTabs.filter(t => t.group === 'today')" :key="tab.key">
                            <div class="relative flex items-center gap-2 p-3 rounded-xl transition-all"
                                 :class="isTabPinned(tab.key) ? 'bg-red-100 ring-2 ring-red-500 shadow-md' : 'bg-red-50/50'">
                                <div class="flex-1 min-w-0">
                                    <div class="text-xs text-red-600 truncate" x-text="tab.label"></div>
                                    <div class="text-xl font-bold text-red-800" x-text="stats[tab.key] ?? 0"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 최근 활동 -->
                <div class="bg-gray-50 rounded-xl p-4">
                    <div class="text-sm font-bold text-gray-700 mb-3">최근 활동</div>
                    <div class="space-y-2">
                        <template x-for="(activity, index) in activities" :key="index">
                            <div class="flex items-center gap-3 text-sm bg-white rounded-lg px-4 py-3 shadow-sm">
                                <span class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center"
                                      :class="{
                                          'bg-blue-100 text-blue-600': activity.type === 'flow',
                                          'bg-green-100 text-green-600': activity.type === 'blog',
                                          'bg-purple-100 text-purple-600': activity.type === 'module'
                                      }">
                                    <span x-text="activity.type === 'flow' ? '⚡' : (activity.type === 'blog' ? '📝' : '📦')"></span>
                                </span>
                                <span class="text-gray-700 truncate flex-1 font-medium" x-text="activity.name"></span>
                                <span class="text-gray-400 text-xs flex-shrink-0" x-text="formatTime(activity.timestamp)"></span>
                            </div>
                        </template>
                        <div x-show="activities.length === 0" class="text-gray-400 text-center py-8">
                            최근 활동이 없습니다
                        </div>
                    </div>
                </div>

                <!-- 고정 탭 설정 버튼 -->
                <div class="mt-6 text-center">
                    <button @click="openSettingsSheet()"
                            class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                        고정 탭 설정
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 백드롭 (요약 패널용) -->
    <div x-show="panelOpen"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closePanel()"
         x-cloak
         class="fixed inset-0 bg-black bg-opacity-50 z-40">
    </div>

    <!-- 설정 하단 시트 -->
    <div x-show="settingsSheetOpen"
         x-cloak
         class="fixed inset-0 z-50">
        <!-- 백드롭 -->
        <div x-show="settingsSheetOpen"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="closeSettingsSheet()"
             class="absolute inset-0 bg-black bg-opacity-50">
        </div>

        <!-- 하단 시트 컨테이너 -->
        <div x-show="settingsSheetOpen"
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="translate-y-full"
             x-transition:enter-end="translate-y-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-y-0"
             x-transition:leave-end="translate-y-full"
             class="absolute bottom-0 inset-x-0 bg-white rounded-t-3xl shadow-2xl"
             style="max-height: 85vh;">

            <!-- 드래그 핸들 -->
            <div class="flex justify-center pt-3 pb-2">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>

            <!-- 시트 헤더 -->
            <div class="flex items-center justify-between px-6 pb-4 border-b border-gray-200">
                <h3 class="text-lg font-bold text-gray-900">고정 탭 설정</h3>
                <button @click="closeSettingsSheet()"
                        class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 시트 콘텐츠 (스크롤 가능) -->
            <div class="overflow-y-auto px-6 py-4" style="max-height: calc(85vh - 100px);">
                <p class="text-sm text-gray-500 mb-4">표시할 요약 탭을 선택하세요. 선택한 탭이 상단 요약 바에 표시됩니다.</p>

                <!-- 블로그 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-blue-600 mb-2 uppercase tracking-wide">블로그</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'blog')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-blue-100 ring-2 ring-blue-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 카테고리 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-green-600 mb-2 uppercase tracking-wide">카테고리</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'category')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-green-100 ring-2 ring-green-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-green-600 focus:ring-green-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 모듈 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-purple-600 mb-2 uppercase tracking-wide">모듈</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'module')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-purple-100 ring-2 ring-purple-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-purple-600 focus:ring-purple-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 플로우 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-cyan-600 mb-2 uppercase tracking-wide">플로우</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'flow')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-cyan-100 ring-2 ring-cyan-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 이번 주 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-orange-600 mb-2 uppercase tracking-wide">이번 주</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'week')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-orange-100 ring-2 ring-orange-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-orange-600 focus:ring-orange-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 오늘 그룹 -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-red-600 mb-2 uppercase tracking-wide">오늘</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <template x-for="tab in allTabs.filter(t => t.group === 'today')" :key="'setting-' + tab.key">
                            <label class="flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all"
                                   :class="isTabPinned(tab.key) ? 'bg-red-100 ring-2 ring-red-500' : 'bg-gray-50 hover:bg-gray-100'">
                                <input type="checkbox"
                                       :checked="isTabPinned(tab.key)"
                                       @change="togglePinTab(tab.key)"
                                       class="w-5 h-5 rounded border-gray-300 text-red-600 focus:ring-red-500">
                                <span class="text-sm font-medium text-gray-700" x-text="tab.label"></span>
                            </label>
                        </template>
                    </div>
                </div>

                <!-- 선택된 탭 개수 표시 -->
                <div class="text-center text-sm text-gray-500 py-2">
                    선택됨: <span class="font-bold text-blue-600" x-text="pinnedTabKeys.length"></span>개
                </div>
            </div>
        </div>
    </div>
</div>
