<!-- 글로벌 요약탭 컴포넌트 -->
<div x-data="globalSummary()" x-init="init()" class="bg-white border-b border-gray-200 shadow-sm relative">
    <!-- 고정 요약탭 바 (가운데 정렬) -->
    <div class="max-w-7xl mx-auto px-4 py-3">
        <div class="flex items-center gap-2">
            <!-- 요약탭 클릭 영역 -->
            <div @click="navigateToDashboard()" class="flex-1 cursor-pointer hover:bg-gray-50 rounded-lg transition-colors">
                <!-- PC: 가로 1행 정렬 -->
                <div class="hidden md:flex items-center justify-center gap-4 overflow-x-auto scrollbar-hide py-1">
                    <template x-for="tab in pinnedTabs" :key="tab.key">
                        <div class="flex items-center gap-2.5 rounded-xl px-4 py-2.5 whitespace-nowrap shadow-sm"
                             :class="tab.bgClass">
                            <span class="text-sm font-medium" :class="tab.textClass" x-text="tab.label"></span>
                            <span class="font-bold text-xl" :class="tab.textClass"
                                  x-text="stats[tab.key] ?? '-'"></span>
                        </div>
                    </template>
                    <template x-if="pinnedTabs.length === 0">
                        <div class="text-gray-400 text-sm py-2">클릭하여 요약 보기</div>
                    </template>
                    <!-- 구분선 -->
                    <div class="hidden md:block w-px h-8 bg-gray-200 mx-1 flex-shrink-0"></div>
                    <!-- 워커 상태 카드 (진행률 그라데이션) -->
                    <template x-for="wk in [{key:'generation',label:'생성'},{key:'publish',label:'발행'},{key:'utility',label:'유틸'},{key:'image',label:'이미지'}]" :key="wk.key">
                        <div class="flex items-center gap-1.5 rounded-xl px-3 py-2 whitespace-nowrap shadow-sm flex-shrink-0"
                             :class="getWorkerCardBorder(wk.key)"
                             :style="getWorkerCardStyle(wk.key)"
                             :title="getWorkerTooltip(wk.key)"
                             role="progressbar"
                             :aria-valuenow="getWorkerProgress(wk.key)"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             :aria-label="wk.label + ' 워커 진행률 ' + getWorkerProgress(wk.key) + '%'">
                            <span class="text-xs font-medium"
                                  :class="workerStatus?.workers?.[wk.key]?.active_tasks > 0 ? 'text-blue-800 font-bold' : 'text-gray-600'"
                                  x-text="wk.label + ' 워커'"></span>
                            <span class="w-2 h-2 rounded-full flex-shrink-0" :class="getWorkerDotClass(wk.key)"></span>
                            <span class="text-sm font-bold text-gray-800"
                                  x-show="workerStatus?.workers?.[wk.key]?.status === 'online'"
                                  x-text="workerStatus?.workers?.[wk.key]?.active_tasks ?? 0"></span>
                            <!-- 진행률 % (active>0일 때만 표시) -->
                            <span class="text-[10px] font-medium text-gray-600 ml-0.5"
                                  x-show="workerStatus?.workers?.[wk.key]?.status === 'online' && (workerStatus?.workers?.[wk.key]?.active_tasks || 0) > 0"
                                  x-text="getWorkerProgress(wk.key) + '%'"></span>
                        </div>
                    </template>
                    <!-- 대기 큐 표시 (PC) -->
                    <div class="flex items-center gap-1.5 rounded-xl px-3 py-2 whitespace-nowrap shadow-sm flex-shrink-0"
                         :class="workerStatus && workerStatus.total_queued > 0 ? 'bg-amber-50 border border-amber-200' : 'bg-gray-50 border border-gray-200'">
                        <span class="text-xs font-medium" :class="workerStatus && workerStatus.total_queued > 0 ? 'text-amber-600' : 'text-gray-400'">대기 큐</span>
                        <span class="text-sm font-bold" :class="workerStatus && workerStatus.total_queued > 0 ? 'text-amber-700' : 'text-gray-400'" x-text="(workerStatus && workerStatus.total_queued) || 0"></span>
                    </div>
                </div>
                <!-- 모바일: 2열 그리드 -->
                <div class="md:hidden grid grid-cols-2 gap-2">
                    <template x-for="tab in pinnedTabs" :key="tab.key">
                        <div class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 shadow-sm"
                             :class="tab.bgClass">
                            <span class="text-xs font-medium truncate" :class="tab.textClass" x-text="tab.label"></span>
                            <span class="font-bold text-lg flex-shrink-0" :class="tab.textClass"
                                  x-text="stats[tab.key] ?? '-'"></span>
                        </div>
                    </template>
                    <!-- 모바일 구분선 -->
                    <div class="col-span-2 border-t border-gray-200"></div>
                    <!-- 모바일 워커 상태 카드 (진행률 그라데이션) -->
                    <template x-for="wk in [{key:'generation',label:'생성'},{key:'publish',label:'발행'},{key:'utility',label:'유틸'},{key:'image',label:'이미지'}]" :key="wk.key">
                        <div class="flex items-center justify-between gap-2 rounded-lg px-3 py-2 shadow-sm"
                             :class="getWorkerCardBorder(wk.key)"
                             :style="getWorkerCardStyle(wk.key)"
                             :title="getWorkerTooltip(wk.key)"
                             role="progressbar"
                             :aria-valuenow="getWorkerProgress(wk.key)"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             :aria-label="wk.label + ' 워커 진행률 ' + getWorkerProgress(wk.key) + '%'">
                            <span class="text-xs font-medium truncate"
                                  :class="workerStatus?.workers?.[wk.key]?.active_tasks > 0 ? 'text-blue-800 font-bold' : 'text-gray-600'"
                                  x-text="wk.label + ' 워커'"></span>
                            <div class="flex items-center gap-1 flex-shrink-0">
                                <span class="w-2 h-2 rounded-full" :class="getWorkerDotClass(wk.key)"></span>
                                <span class="text-sm font-bold text-gray-800"
                                      x-show="workerStatus?.workers?.[wk.key]?.status === 'online'"
                                      x-text="workerStatus?.workers?.[wk.key]?.active_tasks ?? 0"></span>
                                <!-- 진행률 % (모바일은 폭 좁아 축약 표시) -->
                                <span class="text-[10px] text-gray-600"
                                      x-show="workerStatus?.workers?.[wk.key]?.status === 'online' && (workerStatus?.workers?.[wk.key]?.active_tasks || 0) > 0"
                                      x-text="getWorkerProgress(wk.key) + '%'"></span>
                            </div>
                        </div>
                    </template>
                    <!-- 대기 큐 표시 (모바일) -->
                    <div class="col-span-2 flex items-center justify-between gap-2 rounded-lg px-3 py-2 shadow-sm"
                         :class="workerStatus && workerStatus.total_queued > 0 ? 'bg-amber-50 border border-amber-200' : 'bg-gray-50 border border-gray-200'">
                        <span class="text-xs font-medium" :class="workerStatus && workerStatus.total_queued > 0 ? 'text-amber-600' : 'text-gray-400'">대기 큐</span>
                        <span class="text-sm font-bold" :class="workerStatus && workerStatus.total_queued > 0 ? 'text-amber-700' : 'text-gray-400'" x-text="(workerStatus && workerStatus.total_queued) || 0"></span>
                    </div>
                    <template x-if="pinnedTabs.length === 0">
                        <div class="col-span-2 text-center text-gray-400 text-sm py-2">클릭하여 요약 보기</div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- 동작로그 바 - 클릭 시 통합 로그 패널 토글 -->
    <div @click="toggleLogPanel()" class="border-t border-gray-200 bg-primary-dk cursor-pointer hover:opacity-90 transition-colors">
        <div class="max-w-7xl mx-auto px-4 py-1">
            <!-- 로그 메시지 영역 (워커 인디케이터는 요약탭 바로 이동) -->
            <div class="min-w-0">
            <!-- 각 로그를 개별 줄로 표시 -->
            <template x-for="(log, index) in displayLogs" :key="index">
                <div class="log-row text-xs pl-1"
                     :class="[getLogRowBorderClass(log.action_type), getLogRowBgClass(log.level, log.action_type)]">
                    <!-- 고정 영역: 시간 + 레벨 + 액션 배지 -->
                    <div class="log-fixed-area">
                        <span class="text-gray-300 font-mono text-[11px]" x-text="formatLogTime(log.timestamp)"></span>
                        <span class="log-level-badge"
                              :class="{
                                  'log-level-info': log.level === 'INFO',
                                  'log-level-success': log.level === 'SUCCESS',
                                  'log-level-warn': log.level === 'WARN',
                                  'log-level-error': log.level === 'ERROR'
                              }"
                              x-text="log.level"></span>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-medium"
                              :class="getActionBadgeClass(log.action_type)"
                              x-text="getActionLabel(log.action_type)"></span>
                    </div>
                    <!-- 메시지 영역: PC는 정적, 모바일은 슬라이드 -->
                    <div class="log-message-container">
                        <!-- PC: 정적 표시 (truncate) + 플랫폼 뱃지 -->
                        <div class="hidden md:flex items-center gap-1.5 text-gray-300 truncate">
                            <template x-if="getPlatformBadge(log.message)">
                                <span class="inline-flex items-center justify-center w-4 h-4 rounded-sm text-[10px] font-bold text-white flex-shrink-0"
                                      :class="getPlatformBadgeClass(getPlatformBadge(log.message))"
                                      x-text="getPlatformBadge(log.message)"></span>
                            </template>
                            <span class="truncate" x-text="getMessageText(log.message)"></span>
                        </div>
                        <!-- 모바일: 연속 슬라이드 + 플랫폼 뱃지 -->
                        <div class="md:hidden flex items-center gap-1.5">
                            <template x-if="getPlatformBadge(log.message)">
                                <span class="inline-flex items-center justify-center w-4 h-4 rounded-sm text-[10px] font-bold text-white flex-shrink-0"
                                      :class="getPlatformBadgeClass(getPlatformBadge(log.message))"
                                      x-text="getPlatformBadge(log.message)"></span>
                            </template>
                            <div class="log-message-track min-w-0"
                                 :class="{ 'sliding': getMessageText(log.message) && getMessageText(log.message).length > 25 }"
                                 :style="{ '--log-slide-duration': getMessageSlideDuration(getMessageText(log.message)) + 's' }">
                                <span class="log-message-item text-gray-300" x-text="getMessageText(log.message)"></span>
                                <span class="log-message-item text-gray-300" aria-hidden="true" x-text="getMessageText(log.message)"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <!-- 로그 없을 때 -->
            <div x-show="displayLogs.length === 0" class="text-gray-500 text-xs py-1 text-center">
                동작 로그가 없습니다
            </div>
            </div>
        </div>
    </div>

    <!-- 통합 동작로그 패널 -->
    <div x-show="logPanelOpen" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         @click.stop
         class="border-t border-gray-700 bg-gray-900 max-h-[50vh] overflow-y-auto">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <!-- 탭 필터 바 -->
            <div class="flex items-center gap-2 mb-2 flex-wrap">
                <template x-for="f in [{key:'all',label:'전체',dot:''},{key:'action',label:'작업',dot:'bg-blue-400'},{key:'activity',label:'활동',dot:'bg-amber-400'},{key:'generation',label:'생성',dot:'bg-emerald-400'}]" :key="f.key">
                    <button @click.stop="logFilter = f.key; localStorage.setItem('dashboard_log_filter', f.key); loadUnifiedLogs(); loadDisplayLogs()"
                            class="px-2.5 py-1 text-[11px] font-medium rounded-md transition-colors flex items-center gap-1"
                            :class="logFilter === f.key ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'">
                        <span x-show="f.dot" class="w-1.5 h-1.5 rounded-full flex-shrink-0" :class="f.dot"></span>
                        <span x-text="f.label"></span>
                    </button>
                </template>
                <div class="flex-1"></div>
                <input type="text" x-model="logSearch" @click.stop @input.debounce.500ms="loadUnifiedLogs()"
                       placeholder="검색..."
                       class="bg-gray-800 text-gray-300 text-[11px] px-2.5 py-1 rounded-md border border-gray-700 w-32 focus:w-48 transition-all focus:outline-none focus:border-gray-500">
            </div>

            <!-- 검색 위젯: 블로그 + 액션 + 페이지 사이즈 -->
            <div class="flex items-center gap-2 mb-3 flex-wrap text-[11px]">
                <!-- 블로그 드롭다운 -->
                <label class="text-gray-500">블로그:</label>
                <select x-model="logBlogFilter" @change.stop="loadUnifiedLogs()" @click.stop
                        class="bg-gray-800 text-gray-100 px-2 py-1 rounded-md border border-gray-600 focus:outline-none focus:border-gray-400 cursor-pointer"
                        style="color-scheme: dark;">
                    <option value="" class="bg-gray-800 text-gray-100">전체</option>
                    <template x-for="b in logBlogList" :key="b">
                        <option :value="b" x-text="b" class="bg-gray-800 text-gray-100"></option>
                    </template>
                </select>
                <span x-show="logBlogList.length === 0" class="text-gray-600 text-[10px]">(목록 로드 중)</span>

                <!-- 액션 라디오 (발행/재발행/생성 등) -->
                <span class="text-gray-500 ml-2">액션:</span>
                <template x-for="a in [
                    {key:'',label:'전체',cls:'bg-gray-600 text-white'},
                    {key:'publish',label:'발행',cls:'bg-blue-700 text-white'},
                    {key:'republish',label:'재발행',cls:'bg-violet-700 text-white'},
                    {key:'generate',label:'생성',cls:'bg-emerald-700 text-white'},
                    {key:'queue_publish',label:'발행 큐',cls:'bg-blue-900 text-white'},
                    {key:'queue_republish',label:'재발행 큐',cls:'bg-violet-900 text-white'},
                    {key:'queue_generate',label:'생성 큐',cls:'bg-emerald-900 text-white'},
                ]" :key="a.key">
                    <button @click.stop="logActionFilter = a.key; loadUnifiedLogs()"
                            class="px-2 py-0.5 rounded text-[10px] font-medium transition-colors border"
                            :class="logActionFilter === a.key ? a.cls + ' border-transparent' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white border-gray-600'"
                            x-text="a.label"></button>
                </template>

                <!-- 초기화 버튼 -->
                <button @click.stop="resetLogFilters()"
                        class="ml-2 px-2 py-0.5 rounded text-[10px] bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white border border-gray-600">
                    초기화
                </button>

                <div class="flex-1"></div>

                <!-- 페이지 사이즈 선택 -->
                <label class="text-gray-500">표시:</label>
                <template x-for="n in [30, 50, 100, 200]" :key="n">
                    <button @click.stop="setLogPageSize(n)"
                            class="px-1.5 py-0.5 rounded text-[10px] border"
                            :class="logPageSize === n ? 'bg-gray-600 text-white border-transparent' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white border-gray-600'"
                            x-text="n"></button>
                </template>
            </div>
            <!-- 로그 바 표시 수 설정 -->
            <div class="flex items-center gap-2 mb-3 text-[10px] text-gray-500">
                <span>로그 바 표시:</span>
                <template x-for="n in [1, 2, 3]" :key="n">
                    <button @click.stop="setDisplayLogCount(n)"
                            class="px-1.5 py-0.5 rounded"
                            :class="displayLogCount === n ? 'bg-gray-700 text-gray-200' : 'text-gray-500 hover:text-gray-300'"
                            x-text="n"></button>
                </template>
                <span class="ml-3 text-gray-600">총 <span x-text="unifiedLogsTotal" class="text-gray-400 font-mono"></span>건</span>
            </div>
            <!-- 로그 목록 -->
            <div class="space-y-0.5 font-mono">
                <template x-for="log in unifiedLogs" :key="log.id">
                    <div class="flex items-start gap-2 py-1 border-b border-gray-800/50 text-xs pl-1"
                         :class="[getLogRowBorderClass(log.action_type), getLogRowBgClass(log.level, log.action_type)]">
                        <span class="text-gray-500 flex-shrink-0 w-[90px]" x-text="formatLogTime(log.timestamp)"></span>
                        <span class="flex-shrink-0 px-1 py-0.5 rounded text-[10px] font-bold"
                              :class="getLevelClass(log.level)"
                              x-text="log.level"></span>
                        <span class="flex-shrink-0 px-1.5 py-0.5 rounded text-[10px] font-medium"
                              :class="getActionBadgeClass(log.action_type)"
                              x-text="getActionLabel(log.action_type)"></span>
                        <template x-if="log.platform">
                            <span class="inline-flex items-center justify-center w-4 h-4 rounded-sm text-[10px] font-bold text-white flex-shrink-0"
                                  :class="log.platform === '워' ? 'bg-blue-500' : log.platform === '구' ? 'bg-orange-500' : 'bg-gray-500'"
                                  x-text="log.platform"></span>
                        </template>
                        <span class="text-gray-300 break-all" x-text="log.platform ? log.title.replace(/^\[.\]/, '').trim() : log.title"></span>
                    </div>
                </template>
                <div x-show="unifiedLogs.length === 0" class="text-gray-500 text-xs text-center py-4">로그가 없습니다</div>
            </div>
            <!-- 더 보기 -->
            <div x-show="hasMoreUnifiedLogs" class="text-center mt-2">
                <button @click.stop="loadMoreUnifiedLogs()" class="text-[11px] text-gray-400 hover:text-gray-200 py-1">더 보기</button>
            </div>
        </div>
    </div>
</div>
