<!-- 설정 하단 시트 -->
<!-- 백드롭 -->
<div id="settingsBackdrop"
     class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity duration-300"
     onclick="closeSettingsModal()">
</div>

<!-- 하단 시트 (플로우 생성과 동일한 스타일) -->
<div id="settingsModal"
     x-data="settingsApp()"
     x-ref="settingsModal"
     class="fixed inset-x-0 bottom-0 h-[calc(100vh-70px)] bg-white rounded-t-2xl shadow-2xl z-50
            transform translate-y-full transition-transform duration-300 ease-out
            flex flex-col">

    <!-- 핸들 바 -->
    <div class="flex justify-center pt-3 pb-2 flex-shrink-0">
        <div class="w-12 h-1 bg-gray-300 rounded-full"></div>
    </div>

    <!-- 헤더 -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 flex-shrink-0">
        <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            설정
        </h3>
        <button onclick="closeSettingsModal()"
                class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- 스크롤 가능한 콘텐츠 영역 -->
    <div class="flex-1 overflow-y-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">

            <!-- 탭 네비게이션 -->
            <div class="flex border-b border-gray-200 mb-6">
                <button @click="activeTab = 'account'"
                        :class="activeTab === 'account' ? 'border-blue-500 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 transition-colors">
                    계정
                </button>
                <button @click="activeTab = 'ai'"
                        :class="activeTab === 'ai' ? 'border-blue-500 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 transition-colors">
                    AI 서비스
                </button>
                <button @click="activeTab = 'api'"
                        :class="activeTab === 'api' ? 'border-blue-500 text-blue-600 bg-blue-50' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        class="flex-1 py-3 px-4 text-sm font-medium border-b-2 transition-colors">
                    API 설정
                </button>
            </div>

            <!-- 로딩 상태 -->
            <div x-show="loading" class="flex items-center justify-center py-8">
                <div class="loading"></div>
                <span class="ml-2 text-gray-500">로딩 중...</span>
            </div>

            <!-- 계정 설정 탭 -->
            <div x-show="!loading && activeTab === 'account'" x-cloak>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">사용자 이름</label>
                        <input type="text" value="관리자" readonly
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                        <input type="email" value="admin@example.com" readonly
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                        <button @click="changePassword()"
                                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            비밀번호 변경
                        </button>
                        <p class="mt-1 text-xs text-gray-500">비밀번호 변경 기능은 준비 중입니다</p>
                    </div>
                </div>
            </div>

            <!-- AI 서비스 탭 -->
            <div x-show="!loading && activeTab === 'ai'" x-cloak>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">OpenAI API 키</label>
                        <div class="relative">
                            <input :type="showOpenaiKey ? 'text' : 'password'"
                                   x-model="form.openai_api_key"
                                   placeholder="sk-..."
                                   class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <button @click="showOpenaiKey = !showOpenaiKey" type="button"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <svg x-show="!showOpenaiKey" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                                <svg x-show="showOpenaiKey" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                </svg>
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">새 키를 입력하면 기존 키가 교체됩니다</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Claude API 키</label>
                        <div class="relative">
                            <input :type="showClaudeKey ? 'text' : 'password'"
                                   x-model="form.claude_api_key"
                                   placeholder="sk-ant-..."
                                   class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <button @click="showClaudeKey = !showClaudeKey" type="button"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <svg x-show="!showClaudeKey" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                                <svg x-show="showClaudeKey" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                </svg>
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">새 키를 입력하면 기존 키가 교체됩니다</p>
                    </div>
                </div>
            </div>

            <!-- API 설정 탭 -->
            <div x-show="!loading && activeTab === 'api'" x-cloak>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Google Blogger 시간당 발행 제한</label>
                        <select x-model="form.blogger_hourly_limit"
                                @change="checkBloggerWarning()"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="1">1회</option>
                            <option value="2">2회 (권장)</option>
                            <option value="3">3회</option>
                            <option value="4">4회</option>
                        </select>
                        <p class="mt-1 text-xs text-gray-500">동일 Google 계정에서 같은 시간대에 발행할 수 있는 최대 횟수</p>
                    </div>

                    <!-- 경고 메시지 (3회 이상 선택 시) -->
                    <div x-show="showBloggerWarning" x-cloak
                         class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                        <div class="flex items-start gap-3">
                            <svg class="w-5 h-5 text-yellow-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <div>
                                <h4 class="font-medium text-yellow-800">주의</h4>
                                <p class="text-sm text-yellow-700 mt-1">
                                    잦은 빈도로 API를 사용할 경우 Google 계정이 제한될 수 있습니다. 신중하게 설정하세요.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 푸터 버튼 -->
            <div class="flex items-center gap-3 mt-8 pt-6 border-t border-gray-200">
                <button onclick="closeSettingsModal()"
                        class="flex-1 py-3 px-4 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    취소
                </button>
                <button @click="saveSettings()"
                        :disabled="saving"
                        class="flex-1 py-3 px-4 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                    <span x-show="!saving">저장</span>
                    <span x-show="saving" class="flex items-center justify-center gap-2">
                        <div class="loading w-4 h-4"></div>
                        저장 중...
                    </span>
                </button>
            </div>

        </div>
    </div>

    <!-- 하단 안전 영역 (iOS) -->
    <div class="h-safe-area-inset-bottom flex-shrink-0"></div>
</div>

<script src="/static/js/settings.js"></script>
