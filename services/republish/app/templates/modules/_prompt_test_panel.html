<!--
파이프라인 단계별 테스트 패널
편집 모드 + prompt 모듈일 때만 표시
메서드: prompt-test.js의 runStepSelectTitle/runStepRecombine 등 사용
결과키: promptTest.results.selectTitle/recombine 등 (문자열 키)
7단계: 제목선택 → 재조합 → 참조수집 → 글생성 → 내부링크 → 이미지 → 치환
-->

<div x-show="isEdit && formData.type_code === 'prompt'" class="space-y-4">
    <!-- 패널 토글 헤더 -->
    <div class="border border-indigo-200 rounded-lg overflow-hidden">
        <button type="button"
                @click="promptTest.panelOpen = !promptTest.panelOpen"
                class="w-full flex items-center justify-between px-4 py-3 bg-indigo-50 hover:bg-indigo-100 transition-colors">
            <h3 class="text-base font-semibold text-indigo-900 flex items-center gap-2">
                🧪 파이프라인 테스트
                <span class="text-xs font-normal text-indigo-600">(각 단계를 독립 실행하여 결과 확인)</span>
            </h3>
            <svg :class="promptTest.panelOpen ? 'rotate-180' : ''"
                 class="w-5 h-5 text-indigo-600 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </button>

        <div x-show="promptTest.panelOpen" x-transition class="p-4 space-y-4 bg-white">
            <!-- 공통: 블로그 선택 -->
            <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
                <label class="text-sm font-medium text-gray-700 whitespace-nowrap">테스트 블로그:</label>
                <select x-model="promptTest.testBlogId"
                        class="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">-- 블로그 선택 --</option>
                    <template x-for="b in getSelectedBlogOptions()" :key="b.id">
                        <option :value="b.id" x-text="b.name"></option>
                    </template>
                </select>
                <button type="button" @click="clearAllTestResults()"
                        class="px-3 py-1.5 text-xs text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    결과 초기화
                </button>
            </div>

            <!-- 탭 네비게이션 (7단계) -->
            <div class="flex border-b border-gray-200 overflow-x-auto">
                <template x-for="step in [
                    {n:1, key:'selectTitle', label:'1.제목선택'},
                    {n:2, key:'recombine', label:'2.재조합'},
                    {n:3, key:'references', label:'3.참조수집'},
                    {n:4, key:'content', label:'4.글생성'},
                    {n:5, key:'internalLinks', label:'5.내부링크'},
                    {n:6, key:'image', label:'6.이미지'},
                    {n:7, key:'substitution', label:'7.치환'}
                ]" :key="step.n">
                    <button type="button"
                            @click="promptTest.activeStep = step.n"
                            :class="promptTest.activeStep === step.n
                                ? 'border-indigo-500 text-indigo-600 bg-indigo-50'
                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                            class="relative px-3 py-2 text-xs font-medium border-b-2 whitespace-nowrap transition-colors">
                        <span x-text="step.label"></span>
                        <!-- 결과 인디케이터 -->
                        <span x-show="promptTest.results[step.key]?.success === true"
                              class="absolute -top-1 -right-1 w-2 h-2 bg-green-500 rounded-full"></span>
                        <span x-show="promptTest.results[step.key]?.success === false"
                              class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                        <!-- 전체 실행 중 현재 단계 표시 -->
                        <span x-show="promptTest.fullPipelineRunning && promptTest.fullPipelineCurrentStep === step.n"
                              class="absolute -top-1 -right-1 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                    </button>
                </template>
            </div>

            <!-- Step 1: 제목 선택 -->
            <div x-show="promptTest.activeStep === 1" class="space-y-3">
                <p class="text-xs text-gray-500">사용 가능한 제목 후보를 조회하고 랜덤으로 하나를 선택합니다. (DB 변경 없음)</p>
                <button type="button" @click="runStepSelectTitle()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'selectTitle')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'selectTitle'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.selectTitle">
                    <div class="mt-2">
                        <template x-if="promptTest.results.selectTitle.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-2 text-sm">
                                <div class="font-medium text-green-800">선택된 제목:
                                    <span class="font-normal" x-text="promptTest.results.selectTitle.result?.selected_title?.title"></span>
                                </div>
                                <div class="text-green-700">후보 수: <span x-text="promptTest.results.selectTitle.result?.total_candidates"></span>개</div>
                                <details class="text-xs">
                                    <summary class="cursor-pointer text-green-600 hover:underline">후보 목록 보기</summary>
                                    <ul class="mt-1 space-y-0.5 pl-4 list-disc text-gray-600">
                                        <template x-for="c in (promptTest.results.selectTitle.result?.candidates || [])" :key="c.id">
                                            <li><span x-text="c.title"></span> <span class="text-gray-400">(ID: <span x-text="c.id"></span>)</span></li>
                                        </template>
                                    </ul>
                                </details>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.selectTitle.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.selectTitle.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 2: 제목 재조합 -->
            <div x-show="promptTest.activeStep === 2" class="space-y-3">
                <p class="text-xs text-gray-500">AI를 사용하여 선택한 스타일별로 제목을 재조합합니다. (DB 변경 없음)</p>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">원본 제목</label>
                    <input type="text" x-model="promptTest.titleText" placeholder="Step 1에서 자동 입력 또는 직접 입력"
                           class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="button" @click="runStepRecombine()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'recombine')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'recombine'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.recombine">
                    <div class="mt-2">
                        <template x-if="promptTest.results.recombine.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-2 text-sm">
                                <div class="text-green-800">원본: <span class="font-normal" x-text="promptTest.results.recombine.result?.original_title"></span></div>
                                <template x-if="promptTest.results.recombine.result?.style_results?.length > 0">
                                    <div class="space-y-1.5">
                                        <div class="text-xs font-medium text-green-700 border-b border-green-200 pb-1">
                                            스타일별 재조합 결과 (<span x-text="promptTest.results.recombine.result?.total_styles"></span>건)
                                        </div>
                                        <template x-for="(sr, idx) in promptTest.results.recombine.result?.style_results" :key="idx">
                                            <div class="flex items-start gap-2 p-2 bg-white rounded border border-green-100">
                                                <span class="text-base flex-shrink-0" x-text="getStyleIcon(sr.style)"></span>
                                                <div class="flex-1 min-w-0">
                                                    <div class="flex items-center gap-1.5">
                                                        <span class="text-xs font-medium text-green-700 bg-green-100 px-1.5 py-0.5 rounded" x-text="sr.style_label"></span>
                                                        <span x-show="sr.is_modified" class="text-xs text-green-600">변경됨</span>
                                                        <span x-show="!sr.is_modified" class="text-xs text-gray-400">변경없음</span>
                                                    </div>
                                                    <div class="text-sm text-gray-800 mt-0.5" x-text="sr.recombined_title"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="!promptTest.results.recombine.result?.style_results?.length">
                                    <div class="text-green-800 font-medium">재조합: <span class="font-normal" x-text="promptTest.results.recombine.result?.recombined_title"></span></div>
                                </template>
                                <div class="text-green-700 text-xs border-t border-green-200 pt-1.5 mt-1.5">
                                    AI: <span x-text="promptTest.results.recombine.result?.ai_provider"></span>
                                    | Provider 소스: <span x-text="promptTest.results.recombine.result?.settings_used?.provider_source || '-'"></span>
                                    | 소요: <span x-text="promptTest.results.recombine.result?.generation_time_seconds"></span>초
                                </div>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.recombine.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.recombine.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 3: 참조자료 수집 -->
            <div x-show="promptTest.activeStep === 3" class="space-y-3">
                <p class="text-xs text-gray-500">검색어로 참조자료를 수집하고 요약합니다. (DB 변경 없음)</p>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">검색어</label>
                    <input type="text" x-model="promptTest.searchQuery" placeholder="Step 1/2에서 자동 입력 또는 직접 입력"
                           class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="button" @click="runStepReferences()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'references')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'references'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.references">
                    <div class="mt-2">
                        <template x-if="promptTest.results.references.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-1 text-sm">
                                <div class="text-green-800">수집된 참조자료: <span x-text="promptTest.results.references.result?.total_collected"></span>건</div>
                                <div class="text-green-700 text-xs">소요: <span x-text="promptTest.results.references.result?.generation_time_seconds"></span>초</div>
                                <details class="text-xs mt-1">
                                    <summary class="cursor-pointer text-green-600 hover:underline">요약 보기</summary>
                                    <div class="mt-1 space-y-1 pl-2">
                                        <template x-for="(s, i) in (promptTest.results.references.result?.summaries || [])" :key="i">
                                            <div class="p-2 bg-white rounded border border-green-100">
                                                <div class="text-gray-500 truncate" x-text="s.source_url"></div>
                                                <div class="text-gray-700 mt-0.5" x-text="s.summary"></div>
                                            </div>
                                        </template>
                                    </div>
                                </details>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.references.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.references.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 4: 글 생성 -->
            <div x-show="promptTest.activeStep === 4" class="space-y-3">
                <p class="text-xs text-gray-500">AI로 글을 생성합니다. (DB 변경 없음)</p>
                <div class="grid grid-cols-1 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">제목</label>
                        <input type="text" x-model="promptTest.contentTitle" placeholder="이전 단계에서 자동 입력 또는 직접 입력"
                               class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">참조자료 (선택)</label>
                        <textarea x-model="promptTest.contentRef" rows="2" placeholder="Step 3에서 자동 입력 또는 직접 입력"
                                  class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                </div>
                <button type="button" @click="runStepContent()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'content')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'content'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.content">
                    <div class="mt-2">
                        <template x-if="promptTest.results.content.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-1 text-sm">
                                <div class="text-green-800">글 길이: <span x-text="promptTest.results.content.result?.content_length"></span>자</div>
                                <div class="text-green-700 text-xs">
                                    AI: <span x-text="promptTest.results.content.result?.ai_provider"></span>
                                    (<span x-text="promptTest.results.content.result?.ai_model"></span>)
                                    | 소요: <span x-text="promptTest.results.content.result?.generation_time_seconds"></span>초
                                </div>
                                <details class="text-xs mt-1">
                                    <summary class="cursor-pointer text-green-600 hover:underline">마크다운 미리보기</summary>
                                    <pre class="mt-1 p-2 bg-white rounded border border-green-100 overflow-x-auto text-gray-700 whitespace-pre-wrap"
                                         x-text="promptTest.results.content.result?.content_markdown"></pre>
                                </details>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.content.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.content.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 5: 내부링크 추가 -->
            <div x-show="promptTest.activeStep === 5" class="space-y-3">
                <p class="text-xs text-gray-500">생성된 글에 내부링크를 자동 삽입합니다. (글 생성 테스트 후 실행)</p>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">입력 콘텐츠</label>
                    <textarea x-model="promptTest.internalLinksContent" rows="3" placeholder="글 생성 결과에서 자동 입력"
                              class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <button type="button" @click="runStepInternalLinks()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'internalLinks')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'internalLinks'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.internalLinks">
                    <div class="mt-2">
                        <template x-if="promptTest.results.internalLinks.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-1 text-sm">
                                <div class="text-green-800">결과 길이: <span x-text="promptTest.results.internalLinks.result?.content_length || 0"></span>자</div>
                                <div class="text-green-700 text-xs">소요: <span x-text="promptTest.results.internalLinks.result?.generation_time_seconds"></span>초</div>
                                <details class="text-xs mt-1">
                                    <summary class="cursor-pointer text-green-600 hover:underline">결과 미리보기</summary>
                                    <pre class="mt-1 p-2 bg-white rounded border border-green-100 overflow-x-auto text-gray-700 whitespace-pre-wrap text-xs"
                                         x-text="promptTest.results.internalLinks.result?.content_with_links"></pre>
                                </details>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.internalLinks.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.internalLinks.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 6: 이미지 생성 -->
            <div x-show="promptTest.activeStep === 6" class="space-y-3">
                <p class="text-xs text-gray-500">블로그 설정에 따라 AI 또는 템플릿 이미지를 생성합니다.</p>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">이미지 제목</label>
                    <input type="text" x-model="promptTest.imageTitle" placeholder="이전 단계에서 자동 입력 또는 직접 입력"
                           class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <!-- Canvas: 템플릿 모드 렌더링용 -->
                <canvas id="testImageCanvas" style="display:none;"></canvas>
                <button type="button" @click="runStepImage()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'image')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'image'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.image">
                    <div class="mt-2">
                        <template x-if="promptTest.results.image.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-1 text-sm">
                                <div class="text-green-800">모드: <span x-text="promptTest.results.image.result?.image_mode || '없음'"></span>
                                    <span x-show="promptTest.results.image.result?.blog_image_mode"
                                          class="text-xs text-gray-500 ml-1">(블로그: <span x-text="promptTest.results.image.result?.blog_image_mode"></span>)</span>
                                </div>
                                <!-- 템플릿 Canvas 미리보기 -->
                                <template x-if="promptTest.results.image.result?.canvas_rendered">
                                    <div class="mt-1 space-y-1">
                                        <div class="text-green-600 text-xs">Canvas 렌더링 완료 (서버 호출 없음)</div>
                                        <img id="testImagePreview" class="max-w-full rounded border" alt="템플릿 이미지 미리보기"
                                             x-init="$nextTick(() => {
                                                 const cvs = document.getElementById('testImageCanvas');
                                                 const img = document.getElementById('testImagePreview');
                                                 if (cvs && img) img.src = cvs.toDataURL('image/png');
                                             })">
                                    </div>
                                </template>
                                <!-- AI 모드: 대표 이미지 -->
                                <template x-if="!promptTest.results.image.result?.canvas_rendered">
                                    <div>
                                        <div class="text-green-700 text-xs flex flex-wrap gap-x-3 gap-y-0.5 mb-1">
                                            <span>AI 서비스: <span x-text="promptTest.results.image.result?.provider || '-'"></span></span>
                                            <span>모델: <span x-text="promptTest.results.image.result?.ai_model || '-'"></span></span>
                                        </div>
                                        <div x-show="promptTest.results.image.result?.image_url" class="text-green-700 text-xs">대표 이미지 URL: <span x-text="promptTest.results.image.result?.image_url"></span></div>
                                        <div x-show="promptTest.results.image.result?.image_url" class="mt-1">
                                            <img :src="promptTest.results.image.result?.image_url" class="max-w-xs rounded border" alt="대표 이미지"></div>
                                        <template x-if="promptTest.results.image.result?.section_images?.length > 0">
                                            <div class="space-y-1 mt-2">
                                                <div class="text-xs font-medium text-green-700">섹션 이미지 (<span x-text="promptTest.results.image.result.section_images.length"></span>장):</div>
                                                <template x-for="(sImg, sIdx) in promptTest.results.image.result.section_images" :key="sIdx">
                                                    <div class="flex items-center gap-2">
                                                        <img :src="sImg.image_url || sImg" class="w-20 h-20 object-cover rounded border" :alt="'섹션 이미지 ' + (sIdx + 1)">
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <div x-show="!promptTest.results.image.result?.image_url" class="text-green-600 text-xs">이미지가 생성되지 않았습니다</div>
                                    </div>
                                </template>
                                <div class="text-green-700 text-xs">소요: <span x-text="promptTest.results.image.result?.generation_time_seconds"></span>초</div>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.image.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.image.error"></div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Step 7: 변환 및 치환 적용 -->
            <div x-show="promptTest.activeStep === 7" class="space-y-3">
                <p class="text-xs text-gray-500">마크다운 → HTML 변환 및 블로그 치환 규칙을 적용합니다. (글 생성 후 실행)</p>
                <button type="button" @click="runStepSubstitution()" :disabled="promptTest.loading"
                        class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                    <span x-show="!(promptTest.loading && promptTest.loadingKey === 'substitution')">실행</span>
                    <span x-show="promptTest.loading && promptTest.loadingKey === 'substitution'" class="flex items-center gap-1">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        실행중...
                    </span>
                </button>
                <template x-if="promptTest.results.substitution">
                    <div class="mt-2">
                        <template x-if="promptTest.results.substitution.success">
                            <div class="p-3 bg-green-50 border border-green-200 rounded-lg space-y-1 text-sm">
                                <div class="text-green-800">변환 완료 (<span x-text="promptTest.results.substitution.result?.input_length"></span>자 → <span x-text="promptTest.results.substitution.result?.html_length"></span>자)</div>
                                <div class="text-green-700 text-xs">소요: <span x-text="promptTest.results.substitution.result?.generation_time_seconds"></span>초</div>
                                <template x-if="promptTest.results.substitution.result?.settings_used">
                                    <div class="text-xs text-gray-600 space-y-0.5 mt-1">
                                        <div>적용된 규칙: HTML태그 <span class="font-medium" x-text="promptTest.results.substitution.result.settings_used.html_tags_count"></span>개
                                            | CSS클래스 <span class="font-medium" x-text="promptTest.results.substitution.result.settings_used.css_classes_count"></span>개
                                            | 텍스트치환 <span class="font-medium" x-text="promptTest.results.substitution.result.settings_used.text_replace_count"></span>개</div>
                                        <template x-if="promptTest.results.substitution.result.settings_used.html_tags_count > 0">
                                            <div class="text-gray-500">태그 치환: <span x-text="JSON.stringify(promptTest.results.substitution.result.settings_used.html_tags)"></span></div>
                                        </template>
                                        <template x-if="promptTest.results.substitution.result.settings_used.css_classes_count > 0">
                                            <div class="text-gray-500">클래스 추가: <span x-text="JSON.stringify(promptTest.results.substitution.result.settings_used.css_classes)"></span></div>
                                        </template>
                                    </div>
                                </template>
                                <details class="text-xs mt-1">
                                    <summary class="cursor-pointer text-green-600 hover:underline">렌더링 미리보기</summary>
                                    <div class="mt-1 p-2 bg-white rounded border border-green-100 prose prose-sm max-w-none"
                                         x-html="promptTest.results.substitution.result?.final_html"></div>
                                </details>
                                <details class="text-xs mt-1">
                                    <summary class="cursor-pointer text-accent hover:underline">HTML 소스코드 보기</summary>
                                    <pre class="mt-1 p-2 bg-gray-50 rounded border border-primary text-xs overflow-x-auto whitespace-pre-wrap break-all max-h-96"
                                         x-text="promptTest.results.substitution.result?.final_html"></pre>
                                </details>
                            </div>
                        </template>
                        <template x-if="!promptTest.results.substitution.success">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700" x-text="promptTest.results.substitution.error"></div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
