<!--
모듈 카드 부분 템플릿
Alpine.js 데이터 바인딩 사용
-->

<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden"
     :data-module-id="module.id"
     x-data="{ expanded: false, needsExpand: false }"

    <!-- 상단 헤더 영역 (컬러 배경) -->
    <div class="px-4 py-2 flex items-center justify-between text-gray-700"
         :class="getModuleColor(module.module_type.code)">

        <!-- 모듈명 (좌측으로 정렬) -->
        <div class="flex-1">
            <h4 class="font-semibold truncate" x-text="module.name"></h4>
        </div>

        <!-- 우측: 액션 버튼들 -->
        <div class="flex gap-1">
            <button @click="editModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <button @click="copyModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="복사">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>

            <button @click="deleteModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-red-700 hover:bg-red-200/50 rounded-lg transition-colors"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 하단 내용 영역 (흰색 배경) -->
    <div class="px-4 py-4">

        <!-- 내용 영역 (높이 제한 적용) -->
        <div :class="expanded ? '' : 'max-h-32 overflow-hidden'">

            <!-- 재발행 모듈 내용 -->
            <div x-show="module.module_type.code === 'republish'" class="space-y-3">

                <!-- 적용 구간 -->
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-gray-500 font-medium">적용구간:</span>
                    <span class="text-gray-700" x-text="getPostRangeText(module)"></span>
                </div>

                <!-- 재발행 간격 -->
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-gray-500 font-medium">재발행 간격:</span>
                    <span class="text-gray-700" x-text="getIntervalText(module)"></span>
                </div>

                <!-- 스케줄 -->
                <div class="text-sm">
                    <div class="text-gray-500 font-medium mb-1">스케줄:</div>
                    <div class="text-gray-700 whitespace-pre-line" x-text="getScheduleSummary(module)"></div>
                </div>

                <!-- 설명 (있는 경우) -->
                <div x-show="module.description" class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg">
                    <span x-text="module.description"></span>
                </div>
            </div>

            <!-- 기타 모듈 내용 -->
            <div x-show="module.module_type.code !== 'republish'" class="text-center py-8">
                <span class="text-6xl" x-text="getModuleIcon(module.module_type.code)"></span>
                <div x-show="module.description" class="text-sm text-gray-600 mt-4 p-3 bg-gray-50 rounded-lg">
                    <span x-text="module.description"></span>
                </div>
                <div x-show="!module.description" class="text-sm text-gray-400 mt-4">
                    <span x-text="getModuleTypeName(module.module_type.code) + ' 모듈'"></span>
                </div>
            </div>

        </div>

        <!-- 더보기/접기 버튼 -->
        <div class="mt-2 flex justify-end"
             x-init="$nextTick(() => {
                 const contentDiv = $el.previousElementSibling;
                 needsExpand = contentDiv.scrollHeight > 128;
             })">
            <button x-show="needsExpand"
                    @click="expanded = !expanded"
                    class="text-xs text-gray-500 hover:text-gray-700 py-1 px-3 rounded-md hover:bg-gray-100 transition-colors">
                <span x-text="expanded ? '접기>>' : '더보기>>'"></span>
            </button>
        </div>

    </div>
</div>
