<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden"
     :data-module-id="module.id"
     :id="'module-card-' + module.id"
     x-data="moduleCardState()"
     x-init="initCard($el)">

    <!-- 카드 헤더 -->
    <div class="px-4 py-2 flex items-center justify-between text-gray-700"
         :class="getModuleColor(module.module_type.code)">
        <div class="flex-1 min-w-0">
            <h4 class="font-semibold truncate" x-text="module.name"></h4>
        </div>

        <div class="flex gap-1 flex-shrink-0 items-center">
            <!-- Phase E: 레거시 대량 수집 경고 배지 (백엔드 응답의 legacy_bulk_warning 필드와 연동) -->
            <span x-show="module.legacy_bulk_warning"
                  class="inline-flex items-center gap-1 px-2 py-0.5 mr-1 text-xs font-medium rounded-full bg-yellow-100 text-yellow-800 border border-yellow-200"
                  title="대량 수집은 별도 모듈로 분리되었습니다. 신규 '대량 수집' 모듈로 마이그레이션 권장">
                ⚠️ 분리 예정
            </span>

            <button @click="editModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <button @click="copyModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="복사">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>

            <button @click="deleteModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-red-700 hover:bg-red-200/50 rounded-lg transition-colors"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 카드 본문 -->
    <div class="px-4 py-3" x-data="{
        expanded: false,
        get infoRows() {
            return getModuleInfoRows(module);
        },
        get maxVisible() {
            // 설명이 있으면 2개, 없으면 3개 표시 (총 3줄 유지)
            return module.description ? 2 : 3;
        },
        get hiddenCount() {
            return Math.max(0, this.infoRows.length - this.maxVisible);
        }
    }">
        <!-- 설명 -->
        <div x-show="module.description" class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg mb-2">
            <span x-text="module.description"></span>
        </div>

        <!-- 정보 행 목록 (슬라이드 적용) -->
        <template x-if="infoRows.length > 0">
            <div class="module-slide-list">
                <template x-for="(row, rowIndex) in infoRows" :key="rowIndex">
                    <!-- 행 표시 조건: 확장됨 OR 인덱스 < maxVisible -->
                    <div x-show="expanded || rowIndex < maxVisible" x-transition>

                        <!-- 블로그 행: 플로우 카드 스타일로 표시 -->
                        <template x-if="row.type === 'blog' && row.blogs">
                            <div class="blog-slide-section"
                                 @touchstart="toggleSlideTouch && toggleSlideTouch($event, $el)"
                                 x-init="$nextTick(() => typeof initBlogSlideCheck === 'function' && initBlogSlideCheck($el, row.blogs.length))">
                                <!-- 블로그 라벨 -->
                                <div class="blog-slide-label">
                                    <span class="blog-slide-icon">📝</span>
                                    <span class="blog-slide-count">블로그</span>
                                </div>

                                <!-- 슬라이드 영역 -->
                                <div class="blog-slide-container">
                                    <div class="blog-slide-track no-slide"
                                         :style="{ '--blog-slide-duration': getBlogSlideDuration(row.blogs.length) + 's' }">

                                        <!-- 원본 블로그 목록 -->
                                        <template x-for="(blog, i) in row.blogs" :key="'blog-orig-' + blog.id">
                                            <span class="blog-slide-item">
                                                <span class="blog-platform-badge"
                                                      :class="blog.platform === 'wordpress' ? 'blog-platform-wp' : 'blog-platform-bl'"
                                                      x-text="blog.platform === 'wordpress' ? 'WP' : 'BL'"></span>
                                                <span class="blog-slide-name" x-text="blog.name"></span>
                                                <span x-show="i < row.blogs.length - 1" class="blog-slide-separator">·</span>
                                            </span>
                                        </template>

                                        <!-- 구분자 (항상 렌더링, CSS로 제어) -->
                                        <span class="slide-cycle-separator">◆</span>

                                        <!-- 복제 블로그 목록 (항상 렌더링, CSS로 제어) -->
                                        <template x-for="(blog, i) in row.blogs" :key="'blog-dup-' + blog.id">
                                            <span class="blog-slide-item" aria-hidden="true">
                                                <span class="blog-platform-badge"
                                                      :class="blog.platform === 'wordpress' ? 'blog-platform-wp' : 'blog-platform-bl'"
                                                      x-text="blog.platform === 'wordpress' ? 'WP' : 'BL'"></span>
                                                <span class="blog-slide-name" x-text="blog.name"></span>
                                                <span x-show="i < row.blogs.length - 1" class="blog-slide-separator">·</span>
                                            </span>
                                        </template>
                                    </div>
                                    <span class="blog-pause-hint">⏸</span>
                                </div>
                            </div>
                        </template>

                        <!-- 일반 정보 행 -->
                        <template x-if="row.type !== 'blog'">
                            <div class="module-info-row"
                                 :class="'type-' + module.module_type.code"
                                 @touchstart="toggleModuleInfoTouch($event, $el)"
                                 x-init="$nextTick(() => initModuleInfoSlideCheck($el, row.value))">

                                <!-- 라벨 (고정 - 33%, 90px) -->
                                <div class="module-info-label">
                                    <span class="module-info-label-text" x-text="row.label"></span>
                                </div>

                                <!-- 값 슬라이드 영역 (67%) -->
                                <div class="module-info-container">
                                    <div class="module-info-track no-slide"
                                         :style="{ '--slide-duration': getModuleInfoSlideDuration(row.value) + 's' }">

                                        <!-- 원본 값 (tooltip 지원) -->
                                        <span class="module-info-value"
                                              x-text="row.value"
                                              :title="row.tooltip || row.value"></span>

                                        <!-- 구분자 (항상 렌더링, CSS로 제어) -->
                                        <span class="slide-cycle-separator">◆</span>

                                        <!-- 복제 값 (항상 렌더링, CSS로 제어) -->
                                        <span class="module-info-value" x-text="row.value" aria-hidden="true"></span>
                                    </div>
                                    <span class="slide-pause-hint">⏸</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- 정보가 없는 경우 -->
        <div x-show="infoRows.length === 0" class="module-empty-state">
            <span class="text-4xl block mb-2" x-text="getModuleIcon(module.module_type.code)"></span>
            <span x-text="getModuleTypeName(module.module_type.code) + ' 모듈'"></span>
        </div>

        <!-- 더보기/접기 버튼 -->
        <button x-show="hiddenCount > 0"
                @click="expanded = !expanded; $nextTick(() => reinitModuleSlides($el.closest('.module-slide-list') || $el.parentElement))"
                class="card-expand-btn">
            <span x-text="expanded ? '접기 ▲' : `더보기 (${hiddenCount}개 더) ▼`"></span>
        </button>
    </div>
</div>
