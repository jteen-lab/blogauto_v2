<!--
모듈 카드 부분 템플릿
Alpine.js 데이터 바인딩 사용
-->

<div class="bg-white rounded-lg border p-4 hover:shadow-md transition-shadow group"
     :data-module-id="module.id">

    <div class="flex items-start justify-between">
        <div class="flex items-center gap-3 flex-1 min-w-0">
            <!-- 모듈 아이콘과 상태 -->
            <div class="relative">
                <span class="text-2xl" x-text="getModuleIcon(module.type_code)"></span>
                <div class="absolute -top-1 -right-1">
                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                          :class="getStatusClass(module.is_active)">
                        <span x-text="module.is_active ? '활성' : '비활성'"></span>
                    </span>
                </div>
            </div>

            <div class="flex-1 min-w-0">
                <h4 class="font-medium text-gray-900 truncate" x-text="module.name"></h4>
                <div x-show="module.description" class="text-sm text-gray-500 mt-1 line-clamp-2" x-text="module.description"></div>

                <!-- 모듈 정보 -->
                <div class="flex items-center gap-3 mt-2 text-xs text-gray-500">
                    <span x-text="getModuleTypeName(module.type_code)"></span>
                    <span x-show="module.manual_interval_minutes" x-text="module.manual_interval_minutes + '분'"></span>
                    <span x-show="hasSchedule(module)" class="text-blue-600">스케줄됨</span>
                </div>

                <!-- 실행 정보 (재발행 모듈인 경우) -->
                <div x-show="module.type_code === 'republish'" class="flex items-center gap-3 mt-1 text-xs text-gray-400">
                    <span x-show="module.total_executions" x-text="`실행 ${module.total_executions}회`"></span>
                    <span x-show="module.last_execution" x-text="`최근 ${formatTimeAgo(module.last_execution)}`"></span>
                </div>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="flex gap-1">
            <button @click="editModule(module.id)"
                    class="p-1 text-gray-400 hover:text-blue-600"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <!-- 복사 버튼 -->
            <button @click="copyModule(module.id)"
                    class="p-1 text-gray-400 hover:text-green-600"
                    title="복사">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>

            <!-- 삭제 버튼 -->
            <button @click="deleteModule(module.id)"
                    class="p-1 text-gray-400 hover:text-red-600"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 스케줄 정보 (재발행 모듈이고 스케줄이 있는 경우) -->
    <div x-show="module.type_code === 'republish' && hasSchedule(module)"
         class="mt-3 pt-3 border-t border-gray-100">
        <div class="text-xs text-gray-500 space-y-1">
            <div x-show="module.schedule_summary">
                <span class="font-medium">스케줄:</span>
                <span x-text="module.schedule_summary"></span>
            </div>
            <div class="flex items-center gap-4">
                <span x-show="module.active_hours" x-text="`활성 시간: ${module.active_hours}`"></span>
                <span x-show="module.active_days" x-text="`활성 요일: ${module.active_days}`"></span>
            </div>
        </div>
    </div>

    <!-- 설정 정보 (기타 타입) -->
    <div x-show="module.type_code !== 'republish' && module.settings && Object.keys(module.settings).length > 0"
         class="mt-3 pt-3 border-t border-gray-100">
        <details class="text-xs text-gray-500">
            <summary class="cursor-pointer font-medium text-gray-700 hover:text-gray-900">설정 정보</summary>
            <div class="mt-2 space-y-1">
                <template x-for="(value, key) in module.settings" :key="key">
                    <div class="flex justify-between">
                        <span x-text="key"></span>
                        <span x-text="value" class="font-mono"></span>
                    </div>
                </template>
            </div>
        </details>
    </div>

    <!-- 상태 토글 (재발행 모듈인 경우) -->
    <div x-show="module.type_code === 'republish'" class="mt-3 pt-3 border-t border-gray-100">
        <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-gray-700">자동 재발행</span>
            <button @click="toggleModuleStatus(module.id)"
                    class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    :class="module.is_active ? 'bg-blue-600' : 'bg-gray-200'">
                <span class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                      :class="module.is_active ? 'translate-x-5' : 'translate-x-0'"></span>
            </button>
        </div>
    </div>
</div>
