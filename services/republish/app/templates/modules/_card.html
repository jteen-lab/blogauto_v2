<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden"
     :data-module-id="module.id"
     :id="'module-card-' + module.id"
     x-data="moduleCardState()"
     x-init="initCard($el)">

    <!-- 카드 헤더 -->
    <div class="px-4 py-2 flex items-center justify-between text-gray-700"
         :class="getModuleColor(module.module_type.code)">
        <div class="flex-1 min-w-0">
            <h4 class="font-semibold truncate" x-text="module.name"></h4>
        </div>

        <div class="flex gap-1 flex-shrink-0">
            <button @click="editModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="수정">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>

            <button @click="copyModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-300/50 rounded-lg transition-colors"
                    title="복사">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </button>

            <button @click="deleteModule(module.id)"
                    class="p-1.5 text-gray-600 hover:text-red-700 hover:bg-red-200/50 rounded-lg transition-colors"
                    title="삭제">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 카드 본문 -->
    <div class="px-4 py-3" x-data="{
        expanded: false,
        get infoRows() {
            return getModuleInfoRows(module);
        },
        get maxVisible() {
            // 설명이 있으면 2개, 없으면 3개 표시 (총 3줄 유지)
            return module.description ? 2 : 3;
        },
        get hiddenCount() {
            return Math.max(0, this.infoRows.length - this.maxVisible);
        }
    }">
        <!-- 설명 -->
        <div x-show="module.description" class="text-xs text-gray-600 bg-gray-50 p-2 rounded-lg mb-2">
            <span x-text="module.description"></span>
        </div>

        <!-- 정보 행 목록 (슬라이드 적용) -->
        <template x-if="infoRows.length > 0">
            <div class="module-slide-list">
                <template x-for="(row, rowIndex) in infoRows" :key="rowIndex">
                    <!-- 행 표시 조건: 확장됨 OR 인덱스 < maxVisible -->
                    <div x-show="expanded || rowIndex < maxVisible" x-transition>
                        <div class="module-info-row"
                             :class="'type-' + module.module_type.code"
                             @touchstart="toggleModuleInfoTouch($event, $el)"
                             x-init="$nextTick(() => initModuleInfoSlideCheck($el))">

                            <!-- 라벨 (고정 - 33%, 90px) -->
                            <div class="module-info-label">
                                <span class="module-info-label-text" x-text="row.label"></span>
                            </div>

                            <!-- 값 슬라이드 영역 (67%) -->
                            <div class="module-info-container"
                                 :class="{ 'slide-fade-mask': needsModuleInfoSlide(row.value) }">
                                <div class="module-info-track"
                                     :style="{ '--slide-duration': getModuleInfoSlideDuration(row.value) + 's' }"
                                     :class="{ 'no-slide': !needsModuleInfoSlide(row.value) }">

                                    <!-- 원본 값 -->
                                    <span class="module-info-value" x-text="row.value"></span>

                                    <!-- 구분자 (슬라이드 필요시만) -->
                                    <template x-if="needsModuleInfoSlide(row.value)">
                                        <span class="slide-cycle-separator">◆</span>
                                    </template>

                                    <!-- 복제 값 (무한 스크롤용 - 슬라이드 필요시만) -->
                                    <template x-if="needsModuleInfoSlide(row.value)">
                                        <span class="module-info-value" x-text="row.value" aria-hidden="true"></span>
                                    </template>
                                </div>
                                <span class="slide-pause-hint">⏸</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 정보가 없는 경우 -->
        <div x-show="infoRows.length === 0" class="module-empty-state">
            <span class="text-4xl block mb-2" x-text="getModuleIcon(module.module_type.code)"></span>
            <span x-text="getModuleTypeName(module.module_type.code) + ' 모듈'"></span>
        </div>

        <!-- 더보기/접기 버튼 -->
        <button x-show="hiddenCount > 0"
                @click="expanded = !expanded; $nextTick(() => reinitModuleSlides($el.closest('.module-slide-list') || $el.parentElement))"
                class="card-expand-btn">
            <span x-text="expanded ? '접기 ▲' : `더보기 (${hiddenCount}개 더) ▼`"></span>
        </button>
    </div>
</div>
