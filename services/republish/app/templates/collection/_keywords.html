<!-- 키워드 탭 컨텐츠 -->
<div>
    <!-- 검색 바 -->
    <div class="search-bar">
        <div class="flex items-center gap-2 flex-1">
            <div class="search-input-wrapper flex-1 md:max-w-xs">
                <input
                    type="text"
                    x-model="keywordSearch"
                    @keyup.enter="keywordPage = 1; loadKeywords()"
                    placeholder="키워드 검색..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-accent focus:border-primary"
                >
                <button
                    x-show="keywordSearch.length > 0"
                    @click="resetKeywordSearch()"
                    class="search-clear-btn"
                    title="검색 초기화">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <button
                @click="keywordPage = 1; loadKeywords()"
                class="inline-flex items-center justify-center px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors">
                <svg class="w-4 h-4 md:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span class="hidden md:inline">검색</span>
            </button>
        </div>
    </div>

    <!-- 하이브리드 액션 바 -->
    <div class="p-3 bg-gray-50 border-b border-gray-200" x-data="{ manageOpen: false, overflowOpen: false }">
        <!-- 기본 상태 (미선택) -->
        <div x-show="selectedKeywords.length === 0" class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <button @click="$dispatch('open-keyword-modal')"
                    class="inline-flex items-center px-3 py-2 bg-accent text-white rounded-lg text-sm font-medium hover:opacity-90 transition-colors">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    추가
                </button>
                <button @click="$dispatch('open-keyword-excel-modal')"
                    class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 bg-white hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                    <span class="hidden sm:inline">엑셀</span>
                </button>
            </div>
            <div class="flex items-center gap-2">
                <div class="relative" x-show="stats.seed?.total > 0">
                    <button @click="manageOpen = !manageOpen; overflowOpen = false"
                        class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        관리
                        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                    <div x-show="manageOpen" @click.away="manageOpen = false"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="opacity-100 scale-100"
                        x-transition:leave-end="opacity-0 scale-95"
                        class="absolute right-0 mt-1 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                        <button @click="removeDuplicateKeywords(); manageOpen = false"
                            class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                            <svg class="w-4 h-4 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            중복 제거
                        </button>
                        <button @click="reclassifyKeywords(); manageOpen = false"
                            class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                            <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                            카테고리 재분류
                        </button>
                    </div>
                </div>
                <div class="relative" x-show="stats.seed?.total > 0">
                    <button @click="overflowOpen = !overflowOpen; manageOpen = false"
                        class="inline-flex items-center px-2 py-2 border border-gray-300 rounded-lg text-gray-500 bg-white hover:bg-gray-50 transition-colors">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
                        </svg>
                    </button>
                    <div x-show="overflowOpen" @click.away="overflowOpen = false"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="opacity-100 scale-100"
                        x-transition:leave-end="opacity-0 scale-95"
                        class="absolute right-0 mt-1 w-44 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                        <button @click="deleteAllKeywords(); overflowOpen = false"
                            class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            전체 삭제 (<span x-text="stats.seed?.total || 0"></span>)
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 선택 상태 -->
        <div x-show="selectedKeywords.length > 0" class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-2.5 py-1 bg-accent/10 text-accent rounded-full text-sm font-medium">
                    ✓ <span x-text="selectedKeywords.length" class="ml-1"></span>개 선택
                </span>
                <div class="flex items-center gap-2">
                    <button @click="moveSelectedKeywordsToFilter()"
                        class="inline-flex items-center px-3 py-1.5 bg-accent text-white rounded-lg text-sm font-medium hover:opacity-90 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                        </svg>
                        필터로 이동
                    </button>
                    <button @click="deleteSelectedKeywords()"
                        class="inline-flex items-center px-3 py-1.5 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        삭제
                    </button>
                </div>
            </div>
            <button @click="selectedKeywords = []; keywordSelectAll = false"
                class="inline-flex items-center px-3 py-1.5 text-gray-500 hover:text-gray-700 text-sm transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                취소
            </button>
        </div>
    </div>

    <!-- PC 테이블 (768px 이상) -->
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th class="w-12">
                        <input type="checkbox" class="rounded border-gray-300"
                            :checked="keywords.length > 0 && selectedKeywords.length === keywords.length"
                            @click="toggleKeywordSelectAll()">
                    </th>
                    <th @click="sortKeywords('keyword')" class="sortable-header">
                        키워드
                        <span class="sort-icon" :class="{'active': keywordSortField === 'keyword'}"
                              x-text="keywordSortField === 'keyword' ? (keywordSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                    </th>
                    <th @click="sortKeywords('category_path')" class="w-72 sortable-header">
                        카테고리
                        <span class="sort-icon" :class="{'active': keywordSortField === 'category_path'}"
                              x-text="keywordSortField === 'category_path' ? (keywordSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                    </th>
                    <th @click="sortKeywords('use_count')" class="w-32 text-center sortable-header">
                        사용횟수
                        <span class="sort-icon" :class="{'active': keywordSortField === 'use_count'}"
                              x-text="keywordSortField === 'use_count' ? (keywordSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                    </th>
                    <th class="w-32 text-center">액션</th>
                </tr>
            </thead>
            <tbody>
                <!-- 로딩 상태 -->
                <template x-if="keywordLoading">
                    <tr>
                        <td colspan="5" class="text-center py-12">
                            <div class="spinner mx-auto mb-2"></div>
                            <div class="text-gray-500 text-sm">로딩 중...</div>
                        </td>
                    </tr>
                </template>
                <!-- 빈 상태 -->
                <template x-if="!keywordLoading && keywords.length === 0">
                    <tr>
                        <td colspan="5" class="text-center py-12 text-gray-500">
                            <div class="text-4xl mb-2">🔑</div>
                            <div>등록된 키워드가 없습니다</div>
                            <div class="text-sm mt-1">새 키워드를 추가해보세요</div>
                        </td>
                    </tr>
                </template>
                <!-- 데이터 목록 -->
                <template x-for="kw in keywords" :key="kw.id">
                    <tr :class="{'bg-primary-lt': selectedKeywords.includes(kw.id)}">
                        <td class="w-12">
                            <input type="checkbox" class="rounded border-gray-300"
                                :value="kw.id"
                                x-model="selectedKeywords"
                                @change="onKeywordSelect()">
                        </td>
                        <!-- ★ 인라인 편집 가능한 키워드 셀 -->
                        <td class="font-medium">
                            <template x-if="editingKeywordId !== kw.id">
                                <span
                                    @dblclick="startEditKeyword(kw)"
                                    class="cursor-pointer hover:bg-yellow-50 px-1 py-0.5 rounded inline-block"
                                    title="더블클릭하여 수정"
                                    x-text="kw.keyword"></span>
                            </template>
                            <template x-if="editingKeywordId === kw.id">
                                <input
                                    type="text"
                                    x-model="editingKeywordValue"
                                    @keyup.enter="saveEditKeyword(kw.id)"
                                    @keyup.escape="cancelEditKeyword()"
                                    @blur="saveEditKeyword(kw.id)"
                                    x-ref="keywordEditInput"
                                    class="w-full px-2 py-1 border border-primary rounded text-sm focus:outline-none focus:ring-2 focus:ring-accent">
                            </template>
                        </td>
                        <td class="w-72">
                            <!-- 카테고리 관리 연동 (주제 - 하위 주제) 우선 표시 -->
                            <template x-if="kw.category_path">
                                <span class="inline-flex items-center gap-1 text-sm text-emerald-600" :title="'매칭 키워드: ' + kw.keyword">
                                    <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                                    </svg>
                                    <span class="truncate" x-text="kw.category_path"></span>
                                </span>
                            </template>
                            <!-- KeywordCategory 폴백 -->
                            <template x-if="!kw.category_path && kw.category_name">
                                <span class="text-sm text-primary" x-text="kw.category_name"></span>
                            </template>
                            <!-- 미분류 -->
                            <template x-if="!kw.category_path && !kw.category_name">
                                <span class="text-sm text-gray-400">-</span>
                            </template>
                        </td>
                        <td class="w-32 text-center" x-text="kw.use_count || 0"></td>
                        <td class="w-32 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button
                                    @click="moveKeywordToFilter(kw.id)"
                                    class="text-purple-600 hover:text-purple-800 text-sm font-medium"
                                    title="필터로 이동">
                                    필터
                                </button>
                                <span class="text-gray-300">|</span>
                                <button
                                    @click="deleteKeyword(kw.id)"
                                    class="text-red-600 hover:text-red-800 text-sm font-medium">
                                    삭제
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- 모바일 카드 리스트 (768px 미만) -->
    <div class="mobile-card-list">
        <!-- 전체 선택 바 -->
        <div class="mobile-select-all">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="rounded border-gray-300"
                    :checked="keywords.length > 0 && selectedKeywords.length === keywords.length"
                    @click="toggleKeywordSelectAll()">
                <span class="text-sm text-gray-600">전체 선택</span>
            </label>
            <span class="text-xs text-gray-400" x-text="`${selectedKeywords.length}/${keywords.length}개 선택`"></span>
        </div>

        <!-- 로딩 상태 -->
        <template x-if="keywordLoading">
            <div class="text-center py-12">
                <div class="spinner mx-auto mb-2"></div>
                <div class="text-gray-500 text-sm">로딩 중...</div>
            </div>
        </template>

        <!-- 빈 상태 -->
        <template x-if="!keywordLoading && keywords.length === 0">
            <div class="text-center py-12 text-gray-500">
                <div class="text-4xl mb-2">🔑</div>
                <div>등록된 키워드가 없습니다</div>
                <div class="text-sm mt-1">새 키워드를 추가해보세요</div>
            </div>
        </template>

        <!-- 카드 목록 -->
        <template x-for="kw in keywords" :key="kw.id">
            <div class="mobile-card"
                 :class="{'selected': selectedKeywords.includes(kw.id), 'expanded': expandedKeywordId === kw.id}">
                <!-- 카드 헤더 (접힌 상태) -->
                <div class="mobile-card-header" @click="expandedKeywordId = expandedKeywordId === kw.id ? null : kw.id">
                    <div class="mobile-card-checkbox" @click.stop>
                        <input type="checkbox" class="rounded border-gray-300"
                            :value="kw.id"
                            x-model="selectedKeywords"
                            @change="onKeywordSelect()">
                    </div>
                    <div class="mobile-card-main">
                        <div class="mobile-card-title" x-text="kw.keyword"></div>
                        <div class="mobile-card-subtitle">
                            <template x-if="kw.category_path">
                                <span class="text-emerald-600" x-text="kw.category_path"></span>
                            </template>
                            <template x-if="!kw.category_path && kw.category_name">
                                <span class="text-primary" x-text="kw.category_name"></span>
                            </template>
                            <template x-if="!kw.category_path && !kw.category_name">
                                <span class="text-gray-400">미분류</span>
                            </template>
                        </div>
                    </div>
                    <div class="mobile-card-badge">
                        <span class="text-xs text-gray-500" x-text="`사용 ${kw.use_count || 0}회`"></span>
                    </div>
                    <div class="mobile-card-expand">
                        <svg class="w-5 h-5 text-gray-400 transition-transform"
                             :class="{'rotate-180': expandedKeywordId === kw.id}"
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>
                <!-- 카드 상세 (펼친 상태) -->
                <div class="mobile-card-details" x-show="expandedKeywordId === kw.id" x-transition>
                    <div class="mobile-card-detail-row">
                        <span class="mobile-card-detail-label">키워드</span>
                        <span class="mobile-card-detail-value font-medium" x-text="kw.keyword"></span>
                    </div>
                    <div class="mobile-card-detail-row">
                        <span class="mobile-card-detail-label">카테고리</span>
                        <span class="mobile-card-detail-value">
                            <template x-if="kw.category_path">
                                <span class="text-emerald-600" x-text="kw.category_path"></span>
                            </template>
                            <template x-if="!kw.category_path && kw.category_name">
                                <span class="text-primary" x-text="kw.category_name"></span>
                            </template>
                            <template x-if="!kw.category_path && !kw.category_name">
                                <span class="text-gray-400">미분류</span>
                            </template>
                        </span>
                    </div>
                    <div class="mobile-card-detail-row">
                        <span class="mobile-card-detail-label">사용횟수</span>
                        <span class="mobile-card-detail-value" x-text="kw.use_count || 0"></span>
                    </div>
                    <div class="mobile-card-actions">
                        <button @click="moveKeywordToFilter(kw.id)"
                                class="mobile-card-action-btn text-purple-600 border-purple-200 hover:bg-purple-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                            </svg>
                            필터로 이동
                        </button>
                        <button @click="deleteKeyword(kw.id)"
                                class="mobile-card-action-btn text-red-600 border-red-200 hover:bg-red-50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            삭제
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination">
        <div class="text-sm text-gray-600">
            총 <span class="font-semibold" x-text="keywordTotal"></span>개
        </div>
        <div class="flex items-center gap-2">
            <button
                @click="if(keywordPage > 1) { keywordPage--; loadKeywords(); }"
                :disabled="keywordPage <= 1"
                class="px-3 py-1.5 border rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50">
                이전
            </button>
            <span class="text-sm text-gray-600 px-2" x-text="`${keywordPage} 페이지`"></span>
            <button
                @click="if(keywordHasNext) { keywordPage++; loadKeywords(); }"
                :disabled="!keywordHasNext"
                class="px-3 py-1.5 border rounded-lg text-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-50">
                다음
            </button>
        </div>
    </div>
</div>

<!-- 키워드 추가 모달 (대량 입력) -->
<div
    x-data="{ open: false, keywordInput: '', submitting: false, result: null }"
    @open-keyword-modal.window="open = true; keywordInput = ''; result = null"
    x-show="open"
    x-cloak
    class="fixed inset-0 z-50 overflow-y-auto"
    style="background: rgba(0,0,0,0.5)">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div
            @click.away="open = false"
            class="bg-white rounded-lg shadow-xl w-full max-w-lg">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h3 class="text-lg font-semibold">키워드 추가</h3>
                <button @click="open = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="px-6 py-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">키워드 입력</label>
                    <textarea
                        x-model="keywordInput"
                        rows="8"
                        placeholder="키워드를 입력하세요. 한 줄에 하나씩 입력하면 여러 개를 한 번에 등록할 수 있습니다."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-accent resize-none font-mono"
                    ></textarea>
                    <div class="flex justify-between mt-1">
                        <p class="text-xs text-gray-500">줄바꿈으로 구분하여 여러 개 입력 가능</p>
                        <p class="text-xs text-gray-400" x-text="`${keywordInput.split('\\n').filter(k => k.trim()).length}개`"></p>
                    </div>
                </div>
                <!-- 결과 표시 -->
                <div x-show="result" class="p-3 rounded-lg" :class="result?.success ? 'bg-green-50' : 'bg-red-50'">
                    <p class="text-sm" :class="result?.success ? 'text-green-700' : 'text-red-700'" x-text="result?.message"></p>
                </div>
            </div>
            <div class="px-6 py-4 border-t flex justify-end gap-2 bg-gray-50">
                <button
                    type="button"
                    @click="open = false"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg text-sm transition-colors">
                    닫기
                </button>
                <button
                    @click="
                        const lines = keywordInput.split('\n').map(k => k.trim()).filter(k => k);
                        if (lines.length === 0) {
                            result = { success: false, message: '키워드를 입력하세요' };
                            return;
                        }
                        submitting = true;
                        result = null;
                        fetch(`${API_BASE}/data/keywords/seed/bulk`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ keywords: lines })
                        })
                        .then(res => res.json())
                        .then(data => {
                            result = { success: true, message: `${data.created || lines.length}개 키워드가 추가되었습니다` };
                            keywordInput = '';
                            loadKeywords();
                            loadStats();
                        })
                        .catch(() => {
                            result = { success: false, message: '추가 실패' };
                        })
                        .finally(() => submitting = false);
                    "
                    :disabled="submitting || !keywordInput.trim()"
                    class="px-4 py-2 btn-primary text-white rounded-lg text-sm transition-colors disabled:opacity-50">
                    <span x-show="!submitting">추가</span>
                    <span x-show="submitting" class="flex items-center gap-1">
                        <span class="spinner"></span> 처리 중...
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 엑셀 업로드 모달 -->
<div
    x-data="{ open: false, file: null, uploading: false, result: null }"
    @open-keyword-excel-modal.window="open = true; file = null; result = null"
    x-show="open"
    x-cloak
    class="fixed inset-0 z-50 overflow-y-auto"
    style="background: rgba(0,0,0,0.5)">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div
            @click.away="open = false"
            class="bg-white rounded-lg shadow-xl w-full max-w-md">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h3 class="text-lg font-semibold">엑셀 파일로 키워드 일괄 등록</h3>
                <button @click="open = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="px-6 py-4 space-y-4">
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-accent transition-colors">
                    <input
                        type="file"
                        accept=".xlsx,.xls,.csv"
                        @change="file = $event.target.files[0]"
                        class="hidden"
                        id="keyword-excel-input"
                    >
                    <label for="keyword-excel-input" class="cursor-pointer">
                        <svg class="w-12 h-12 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                        <p class="text-sm text-gray-600" x-show="!file">클릭하여 파일 선택</p>
                        <p class="text-sm text-primary font-medium" x-show="file" x-text="file?.name"></p>
                    </label>
                </div>
                <div class="bg-primary-lt border border-primary rounded-lg p-3">
                    <p class="text-xs text-primary font-medium mb-1">📋 파일 형식 안내</p>
                    <ul class="text-xs text-primary space-y-0.5">
                        <li>• 지원 형식: .xlsx, .xls, .csv</li>
                        <li>• 첫 번째 열(A열)에 키워드 입력</li>
                        <li>• 첫 번째 행은 헤더로 인식 (건너뜀)</li>
                    </ul>
                </div>
                <!-- 결과 표시 -->
                <div x-show="result" class="p-3 rounded-lg" :class="result?.success ? 'bg-green-50' : 'bg-red-50'">
                    <p class="text-sm" :class="result?.success ? 'text-green-700' : 'text-red-700'" x-text="result?.message"></p>
                </div>
            </div>
            <div class="px-6 py-4 border-t flex justify-end gap-2 bg-gray-50">
                <button
                    type="button"
                    @click="open = false"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg text-sm transition-colors">
                    닫기
                </button>
                <button
                    @click="
                        if (!file) { result = { success: false, message: '파일을 선택하세요' }; return; }
                        uploading = true;
                        result = null;
                        const formData = new FormData();
                        formData.append('file', file);
                        fetch(`${API_BASE}/data/keywords/upload`, {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.detail) throw new Error(data.detail);
                            result = { success: true, message: `${data.created}개 키워드가 등록되었습니다` };
                            file = null;
                            document.getElementById('keyword-excel-input').value = '';
                            loadKeywords();
                            loadStats();
                        })
                        .catch(e => {
                            result = { success: false, message: e.message || '업로드 실패' };
                        })
                        .finally(() => uploading = false);
                    "
                    :disabled="uploading || !file"
                    class="px-4 py-2 btn-primary text-white rounded-lg text-sm transition-colors disabled:opacity-50">
                    <span x-show="!uploading">업로드</span>
                    <span x-show="uploading" class="flex items-center gap-1">
                        <span class="spinner"></span> 업로드 중...
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
