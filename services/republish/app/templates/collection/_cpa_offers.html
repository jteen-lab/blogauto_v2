{# CPA 오퍼 — 별도 페이지가 아니라 데이터 관리의 한 탭이다.
   화면을 따로 두면 기존 흐름 밖에 새 로직이 생긴다. #}
<div x-data="cpaApp()" x-init="load()">

    <div class="flex items-center justify-between mb-5">
        <div>
            <h2 class="text-lg font-bold">🎯 CPA 오퍼</h2>
            <p class="text-sm text-gray-500 mt-1">
                프로모션 페이지 원문을 붙여넣으면 규칙을 뽑아 둡니다.
                확인한 오퍼로만 글을 만듭니다.
            </p>
        </div>
        <button @click="showForm = !showForm"
                class="bg-primary text-white px-4 py-2 rounded text-sm">
            <span x-text="showForm ? '닫기' : '＋ 오퍼 등록'"></span>
        </button>
    </div>

    <!-- 상태 요약 -->
    <div class="grid grid-cols-4 gap-3 mb-5">
        <template x-for="s in STATES" :key="s.key">
            <button @click="filter = (filter === s.key ? '' : s.key); load()"
                    :class="filter === s.key ? 'ring-2 ring-primary' : ''"
                    class="bg-white border rounded p-3 text-left">
                <div class="text-xs text-gray-500" x-text="s.label"></div>
                <div class="text-xl font-bold"
                     x-text="counts[s.key] || 0"></div>
            </button>
        </template>
    </div>

    <!-- 등록 -->
    <div x-show="showForm" x-cloak class="bg-white border rounded p-4 mb-6">
        <div class="grid grid-cols-3 gap-3 mb-3">
            <div>
                <label class="block text-xs text-gray-600 mb-1">네트워크</label>
                <select x-model="form.network" class="w-full border rounded px-2 py-1.5 text-sm">
                    <option value="adlix">애드릭스</option>
                    <option value="etc">기타</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-600 mb-1">오퍼 번호</label>
                <input x-model="form.offer_code" placeholder="6936855"
                       class="w-full border rounded px-2 py-1.5 text-sm">
            </div>
            <div>
                <label class="block text-xs text-gray-600 mb-1">재확인 주기(일)</label>
                <input x-model.number="form.recheck_days" type="number" min="1" max="365"
                       class="w-full border rounded px-2 py-1.5 text-sm">
            </div>
        </div>
        <label class="block text-xs text-gray-600 mb-1">
            프로모션 페이지 원문 — <b>가공하지 말고 그대로</b> 붙여넣으세요
        </label>
        <textarea x-model="form.raw_text" rows="10"
                  class="w-full border rounded px-3 py-2 text-sm font-mono"
                  placeholder="[캠페인명] CPA 캠페인입니다. …"></textarea>
        <div class="flex items-center justify-between mt-3">
            <p class="text-xs text-gray-500">
                애드릭스 페이지는 로그인해야 열려 자동으로 가져올 수 없습니다.
            </p>
            <button @click="create()" :disabled="busy || (form.raw_text||'').length < 20"
                    class="bg-primary text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                <span x-text="busy ? '처리 중…' : '규칙 뽑기'"></span>
            </button>
        </div>
    </div>

    <!-- 목록 -->
    <div class="space-y-4">
        <template x-for="o in items" :key="o.id">
            <div class="bg-white border rounded">
                <div class="p-4 flex items-start justify-between gap-4">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold" x-text="o.name"></span>
                            <span class="text-xs px-2 py-0.5 rounded"
                                  :class="badge(o)" x-text="stateLabel(o)"></span>
                            <span class="text-xs text-gray-400"
                                  x-text="o.network + (o.offer_code ? ' · ' + o.offer_code : '')"></span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1">
                            하위주제
                            <b x-text="(o.subtopic_ids || []).length + '개'"
                               :class="(o.subtopic_ids || []).length ? '' : 'text-red-600'"></b> ·
                            규칙 <b x-text="o.rules.length"></b>건 ·
                            커버리지 <b x-text="o.coverage === null ? '—' : Math.round(o.coverage*100) + '%'"></b> ·
                            재확인 <b x-text="dday(o.recheck_due)"></b>
                        </div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button @click="extract(o)" :disabled="busy"
                                class="text-sm border px-3 py-1.5 rounded disabled:opacity-50">규칙 뽑기</button>
                        <button @click="open(o)" class="text-sm border px-3 py-1.5 rounded">
                            <span x-text="openId === o.id ? '접기' : '자세히'"></span>
                        </button>
                        <button x-show="o.usable" @click="makeTitles(o)" :disabled="busy"
                                class="text-sm border px-3 py-1.5 rounded disabled:opacity-50">제목 생성</button>
                        <button x-show="o.status === 'draft' || o.status === 'recheck'"
                                @click="confirm_(o)"
                                class="text-sm bg-primary text-white px-3 py-1.5 rounded">승인</button>
                    </div>
                </div>

                <!-- 확인해야 할 것 — 접어두면 보지 않는다 -->
                <div class="px-4 pb-4">
                    <div class="bg-amber-50 border border-amber-200 rounded p-3 text-sm">
                        <div class="font-medium text-amber-900 mb-1">확인 필요</div>
                        <ul class="text-amber-800 space-y-0.5 text-xs">
                            <li x-show="o.rules.length === 0">
                                · 규칙이 0건입니다 — <b>지금은 검사가 거의 없습니다</b>
                                (자유 서술 규칙 추출은 다음 단계)
                            </li>
                            <li x-show="o.unmatched.length">
                                · 미분류 문장 <b x-text="o.unmatched.length"></b>개 —
                                <b>검사되지 않습니다</b>
                                <button @click="showUnmatched = (showUnmatched === o.id ? null : o.id)"
                                        class="underline ml-1">보기</button>
                            </li>
                            <li x-show="o.conflicts.length">
                                · 충돌 <b x-text="o.conflicts.length"></b>건 —
                                <b>사람이 판단해야 합니다</b>
                                <button @click="showConflicts = (showConflicts === o.id ? null : o.id)"
                                        class="underline ml-1">보기</button>
                            </li>
                            <li x-show="o.advisory_count">
                                · 사람이 봐야 할 항목 <b x-text="o.advisory_count"></b>건
                            </li>
                            <li x-show="o.note" class="text-red-700">
                                · <b x-text="o.note"></b>
                            </li>
                            <li x-show="!(o.subtopic_ids || []).length" class="text-red-700">
                                · <b>쓸 하위주제가 없습니다</b> — 지정해야
                                키워드·제목이 같은 자리에 모입니다
                            </li>
                            <li x-show="!o.ftc_notice">
                                · <b>대가성 문구를 찾지 못했습니다</b> — 표시하지 않으면 위법입니다
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 미분류 문장 -->
                <div x-show="showUnmatched === o.id" x-cloak class="px-4 pb-4">
                    <div class="border rounded bg-gray-50 p-3 max-h-64 overflow-auto">
                        <div class="text-xs text-gray-500 mb-2">
                            규칙으로 바뀌지 않은 문장입니다. <b>이 내용은 검사되지 않습니다.</b><br>
                            유형을 골라 <b>규칙으로</b> 올리거나, 규칙이 아니면 <b>무시</b>로 빼세요.
                        </div>
                        <template x-for="(line, i) in o.unmatched" :key="i">
                            <div class="text-xs py-1 border-b last:border-0 flex items-center gap-2">
                                <span class="flex-1" x-text="line"></span>
                                <select :id="`t-${o.id}-${i}`"
                                        class="border rounded px-1 py-0.5 text-xs">
                                    <option value="">유형 선택…</option>
                                    <option value="must_not_include">금지 낱말</option>
                                    <option value="must_include">필수 문구</option>
                                    <option value="required_topic">필수 고지</option>
                                    <option value="forbidden_topic">금지 주제</option>
                                    <option value="content_source">사실 정보</option>
                                    <option value="content_axis">추천 키워드</option>
                                    <option value="conversion">대상 조건</option>
                                    <option value="channel">매체 제한</option>
                                    <option value="asset">사용 자료</option>
                                    <option value="advisory">사람 확인</option>
                                </select>
                                <button @click="addRule(o, line, `t-${o.id}-${i}`)"
                                        class="border px-2 py-0.5 rounded">규칙으로</button>
                                <button @click="ignore(o, line)"
                                        class="text-gray-400 px-1">무시</button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 충돌 -->
                <div x-show="showConflicts === o.id" x-cloak class="px-4 pb-4">
                    <div class="border border-red-200 rounded bg-red-50 p-3 space-y-2">
                        <template x-for="(c, i) in o.conflicts" :key="i">
                            <div class="text-xs">
                                <div class="font-medium text-red-900" x-text="c.hint"></div>
                                <div class="text-red-700 mt-0.5">
                                    규칙: <span x-text="c.rule_quote"></span>
                                </div>
                                <div class="text-red-700" x-show="c.text_quote">
                                    본문: <span x-text="c.text_quote"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 상세 -->
                <div x-show="openId === o.id" x-cloak class="border-t px-4 py-4 text-sm">
                    <!-- 정형 규칙 칸 — 무엇이 비었는지 보이게 한다 -->
                    <div x-show="tpl" x-cloak class="mb-4">
                        <div class="text-xs text-gray-500 mb-1">
                            정형 항목 <b x-text="`${tpl?.filled ?? 0}/${tpl?.total ?? 0}`"></b> 채움
                            <span x-show="criticalMissing.length" class="text-red-600 ml-1">
                                · 필수 누락: <b x-text="criticalMissing.join(', ')"></b>
                            </span>
                        </div>
                        <div class="border rounded divide-y max-h-80 overflow-auto">
                            <template x-for="sl in (tpl?.slots || [])" :key="sl.key">
                                <div class="px-2 py-1.5 text-xs flex gap-2 items-start"
                                     :class="!sl.count && sl.critical ? 'bg-red-50' : ''">
                                    <span class="w-40 shrink-0"
                                          :class="sl.count ? 'text-gray-700' : 'text-gray-400'">
                                        <span x-text="sl.count ? '✓' : '·'"></span>
                                        <span x-text="sl.label"></span>
                                    </span>
                                    <span class="flex-1">
                                        <template x-if="sl.count">
                                            <span x-text="sl.rules.map(r => r.value || r.target).join(' · ').slice(0, 90)"></span>
                                        </template>
                                        <template x-if="!sl.count">
                                            <span class="text-gray-400" x-text="sl.hint"></span>
                                        </template>
                                    </span>
                                </div>
                            </template>
                        </div>
                        <div x-show="(tpl?.extras || []).length" class="mt-2">
                            <div class="text-xs text-gray-500 mb-1">
                                정형 칸에 없는 규칙 <b x-text="(tpl?.extras || []).length"></b>건 —
                                확인 후 두거나 빼세요
                            </div>
                            <div class="border rounded bg-amber-50 p-2 space-y-1">
                                <template x-for="(e, i) in (tpl?.extras || [])" :key="i">
                                    <div class="text-xs">
                                        <span class="text-gray-500" x-text="e.type"></span>
                                        <span x-text="e.value || e.target"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- 오퍼 이미지 -->
                    <div class="mb-4">
                        <div class="text-xs text-gray-500 mb-1">
                            오퍼 이미지 — 글 생성 때 이 목록에서만 씁니다
                        </div>
                        <div class="flex flex-wrap gap-2 mb-2">
                            <template x-for="(img, i) in (o.images || [])" :key="i">
                                <div class="border rounded p-1 text-xs">
                                    <img :src="`/api/v1/cpa/offers/${o.id}/images/${i}/file`"
                                         class="h-16 w-24 object-cover mb-1">
                                    <div class="truncate w-24" x-text="img.name"></div>
                                    <button @click="removeImage(o, i)" class="text-red-600">빼기</button>
                                </div>
                            </template>
                            <div x-show="!(o.images || []).length" class="text-xs text-gray-400">
                                등록된 이미지가 없습니다.
                            </div>
                        </div>
                        <input type="file" accept="image/*" class="text-xs"
                               @change="uploadImage(o, $event)">
                    </div>

                    <div x-show="!o.rules.length"
                         class="mb-4 text-xs text-gray-500 border rounded p-3">
                        규칙이 없습니다. 「규칙 뽑기」를 먼저 실행하세요.
                        실행했는데도 비어 있으면 위 <b>확인 필요</b> 를 보세요.
                    </div>
                    <div x-show="o.rules.length" class="mb-4">
                        <div class="text-xs text-gray-500 mb-1">
                            규칙 <span x-text="o.rules.length"></span>건 —
                            차단 <span x-text="o.counts.block"></span> ·
                            경고 <span x-text="o.counts.warn"></span> ·
                            확인 <span x-text="o.counts.review"></span>
                        </div>
                        <div class="border rounded max-h-72 overflow-auto">
                            <template x-for="(r, i) in o.rules" :key="i">
                                <div class="px-2 py-1 text-xs border-b last:border-0 flex gap-2">
                                    <span class="shrink-0 w-32 text-gray-500" x-text="r.type"></span>
                                    <span class="shrink-0 w-14 text-gray-400" x-text="r.scope"></span>
                                    <span class="shrink-0 w-10"
                                          :class="r.severity === 'block' ? 'text-red-600' : 'text-amber-600'"
                                          x-text="r.severity === 'block' ? '차단' : (r.severity === 'warn' ? '경고' : '확인')"></span>
                                    <span class="truncate" x-text="r.value || r.target"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-xs text-gray-500 mb-1">전환</div>
                            <div class="mb-2">
                                접수 항목:
                                <span x-text="(o.conversion.fields||[]).join(', ') || '—'"></span>
                            </div>
                            <div class="text-xs text-gray-500 mb-1">미승인 조건</div>
                            <div class="text-xs">
                                <span x-text="(o.conversion.reject_reasons||[]).join(' · ') || '—'"></span>
                            </div>
                        </div>
                        <div>
                            <div class="text-xs text-gray-500 mb-1">
                                쓸 하위주제 — <b>소유가 아니라 참조</b>입니다.
                                애드센스도 같은 하위주제를 계속 씁니다.
                            </div>
                            <div class="border rounded p-2 mb-2 max-h-40 overflow-auto">
                                <template x-for="sub in subtopics" :key="sub.id">
                                    <label class="flex items-center gap-2 text-xs py-0.5">
                                        <input type="checkbox" :value="sub.id"
                                               :checked="(o.subtopic_ids || []).includes(sub.id)"
                                               @change="toggleSubtopic(o, sub.id, $event.target.checked)">
                                        <span x-text="sub.topic_name + ' > ' + sub.name"></span>
                                    </label>
                                </template>
                                <div x-show="!subtopics.length" class="text-xs text-gray-400">
                                    하위주제를 불러오지 못했습니다.
                                </div>
                            </div>
                            <div class="flex gap-2 mb-3">
                                <select :id="`newtopic-${o.id}`"
                                        class="flex-1 border rounded px-2 py-1 text-xs">
                                    <option value="">새 하위주제를 만들 주제…</option>
                                    <template x-for="t in topics" :key="t.id">
                                        <option :value="t.id" x-text="t.name"></option>
                                    </template>
                                </select>
                                <button @click="newSubtopic(o)"
                                        class="border px-2 py-1 rounded text-xs">새로 만들기</button>
                            </div>
                            <div class="text-xs text-gray-500 mb-1">공정위 대가성 문구</div>
                            <input :value="o.ftc_notice"
                                   @change="patch(o, {ftc_notice: $event.target.value})"
                                   class="w-full border rounded px-2 py-1 text-xs mb-2">
                            <div class="text-xs text-gray-500 mb-1">랜딩 URL</div>
                            <input :value="o.landing_url"
                                   @change="patch(o, {landing_url: $event.target.value})"
                                   class="w-full border rounded px-2 py-1 text-xs">
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button @click="showPrompt(o)" class="text-xs border px-2 py-1 rounded">
                            글 지시문 보기
                        </button>
                        <button @click="showPage(o)" class="text-xs border px-2 py-1 rounded">
                            상담 페이지 미리보기
                        </button>
                    </div>
                    <pre x-show="preview" x-cloak
                         class="mt-2 bg-gray-50 border rounded p-3 text-xs whitespace-pre-wrap max-h-80 overflow-auto"
                         x-text="preview"></pre>

                    <details class="mt-4">
                        <summary class="cursor-pointer text-xs text-gray-500">원문 보기</summary>
                        <pre class="mt-2 bg-gray-50 border rounded p-3 text-xs whitespace-pre-wrap"
                             x-text="rawText"></pre>
                    </details>
                </div>
            </div>
        </template>
        <div x-show="!items.length" class="text-center text-gray-400 py-12 text-sm">
            등록된 오퍼가 없습니다.
        </div>
    </div>
</div>

<script src="/static/js/cpa/offers.js?v=20260909a"></script>
