<!-- 정식 제목 탭 컨텐츠 -->
<div>
    <!-- 페어 매칭 안내 (블로그 선택 시 상단에 표시) -->
    <div x-show="selectedBlogId" x-cloak
         class="p-4 bg-purple-50 border-b border-purple-100">
        <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-purple-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div class="text-sm text-purple-700">
                <p class="font-medium">1:1 페어 매칭 방법</p>
                <p class="mt-1 text-xs">
                    독립포스트 1개와 미매칭 크롤링 1개를 선택한 후 "1:1 페어 매칭" 버튼을 클릭하세요.
                </p>
            </div>
        </div>
        <!-- 선택 현황 -->
        <div class="mt-3 flex flex-wrap gap-3 text-xs">
            <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg">
                <span class="text-gray-600">독립포스트 선택:</span>
                <span class="font-bold" :class="selectedMainTitles.length === 1 ? 'text-accent' : 'text-gray-400'"
                      x-text="selectedMainTitles.length + '개'"></span>
            </div>
            <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg">
                <span class="text-gray-600">미매칭 크롤링 선택:</span>
                <span class="font-bold" :class="selectedUnmatchedCrawled.length === 1 ? 'text-red-600' : 'text-gray-400'"
                      x-text="selectedUnmatchedCrawled.length + '개'"></span>
            </div>
            <template x-if="canPairMatch">
                <span class="text-green-600 font-medium">✓ 페어 매칭 가능!</span>
            </template>
        </div>
    </div>

    <!-- Phase 2-2: 블로그 선택 및 매칭 현황 -->
    <div class="p-4 bg-gradient-to-r from-primary-lt to-primary-lt border-b border-primary">
        <div class="flex flex-col md:flex-row md:items-center gap-4">
            <!-- 블로그 선택 -->
            <div class="flex items-center gap-2 flex-1">
                <label class="text-sm font-medium text-gray-700 flex-shrink-0">블로그:</label>
                <select x-model="selectedBlogId"
                        @change="loadMatchingPairs()"
                        class="flex-1 md:max-w-xs px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-accent">
                    <option value="">블로그 선택 (전체 보기)</option>
                    <template x-for="blog in availableBlogs" :key="blog.id">
                        <option :value="blog.id" x-text="blog.name + ' (' + blog.platform + ')'"></option>
                    </template>
                </select>
            </div>

            <!-- 매칭 현황 (블로그 선택 시 표시) -->
            <div x-show="selectedBlogId && matchingSummary" x-cloak
                 class="flex items-center gap-3 bg-white rounded-lg px-4 py-2 shadow-sm">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500">전체:</span>
                    <span class="font-bold text-gray-800" x-text="matchingSummary?.total || 0"></span>
                </div>
                <div class="w-px h-4 bg-gray-300"></div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                    <span class="text-xs text-gray-500">발행완료:</span>
                    <span class="font-bold text-purple-600" x-text="matchingSummary?.published || 0"></span>
                </div>
                <div class="w-px h-4 bg-gray-300"></div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-xs text-gray-500">발행대기:</span>
                    <span class="font-bold text-amber-600" x-text="matchingSummary?.pending || 0"></span>
                </div>
                <div class="w-px h-4 bg-gray-300"></div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-primary"></span>
                    <span class="text-xs text-gray-500">독립:</span>
                    <span class="font-bold text-accent" x-text="matchingSummary?.unmatched || 0"></span>
                </div>
                <div class="w-px h-4 bg-gray-300"></div>
                <div class="flex items-center gap-2"
                     :title="'블로그에 발행됐지만 정식제목에 매칭되지 않은 글 수'">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-xs text-gray-500">미매칭:</span>
                    <span class="font-bold text-rose-600" x-text="matchingSummary?.unmatched_published || 0"></span>
                </div>
            </div>
        </div>

        <!-- 매칭 필터 (블로그 선택 시) -->
        <div x-show="selectedBlogId" x-cloak class="mt-3 flex flex-wrap gap-2">
            <button @click="matchingFilter = 'all'; mainTitlePage = 1; loadMainTitlesWithCrawled()"
                    class="px-3 py-1.5 rounded-full text-xs font-medium transition-colors"
                    :class="matchingFilter === 'all' ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'">
                전체
            </button>
            <button @click="matchingFilter = 'matched'; mainTitlePage = 1; loadMainTitles()"
                    class="px-3 py-1.5 rounded-full text-xs font-medium transition-colors"
                    :class="matchingFilter === 'matched' ? 'bg-green-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'">
                매칭됨
            </button>
            <button @click="matchingFilter = 'unmatched'; mainTitlePage = 1; loadMainTitles()"
                    class="px-3 py-1.5 rounded-full text-xs font-medium transition-colors"
                    :class="matchingFilter === 'unmatched' ? 'btn-primary' : 'bg-white text-gray-600 hover:bg-gray-100'">
                독립포스트
            </button>
        </div>
    </div>

    <!-- 검색 바 -->
    <div class="search-bar">
        <div class="flex items-center gap-2 flex-1">
            <div class="search-input-wrapper flex-1 md:max-w-xs">
                <input
                    type="text"
                    x-model="mainTitleSearch"
                    @keyup.enter="mainTitlePage = 1; matchingFilter === 'all' ? loadMainTitlesWithCrawled() : loadMainTitles()"
                    placeholder="제목 검색..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-accent focus:border-primary"
                >
                <button
                    x-show="mainTitleSearch.length > 0"
                    @click="resetMainTitleSearch()"
                    class="search-clear-btn"
                    title="검색 초기화">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <select
                x-model="mainTitleViewMode"
                @change="mainTitlePage = 1; matchingFilter === 'all' ? loadMainTitlesWithCrawled() : loadMainTitles()"
                class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-accent">
                <option value="all">전체 보기</option>
                <option value="group">그룹별 보기</option>
            </select>
            <button
                @click="mainTitlePage = 1; matchingFilter === 'all' ? loadMainTitlesWithCrawled() : loadMainTitles()"
                class="inline-flex items-center justify-center px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors">
                <svg class="w-4 h-4 md:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <span class="hidden md:inline">검색</span>
            </button>
        </div>
    </div>

    <!-- 하이브리드 액션 바 -->
    <div class="p-3 bg-gray-50 border-b border-gray-200" x-data="{ manageOpen: false }">
        <!-- 기본 상태 (미선택) -->
        <div x-show="selectedMainTitles.length === 0 && selectedUnmatchedCrawled.length === 0" class="flex items-center justify-end gap-2">
            <!-- 관리 드롭다운 -->
            <div class="relative" x-show="stats.main?.total > 0">
                <button @click="manageOpen = !manageOpen"
                    class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    관리
                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div x-show="manageOpen" @click.away="manageOpen = false"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0 scale-95"
                    x-transition:enter-end="opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75"
                    x-transition:leave-start="opacity-100 scale-100"
                    x-transition:leave-end="opacity-0 scale-95"
                    class="absolute right-0 mt-1 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                    <button @click="reclassifyMainTitles(); manageOpen = false"
                        class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                        카테고리 재분류
                    </button>
                    <button @click="openBulkReplace('main'); manageOpen = false"
                        class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                        <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                        단어 치환
                    </button>
                </div>
            </div>
        </div>
        <!-- 선택 상태 -->
        <div x-show="selectedMainTitles.length > 0 || selectedUnmatchedCrawled.length > 0" class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center px-2.5 py-1 bg-accent/10 text-accent rounded-full text-sm font-medium">
                    ✓ <span x-text="selectedMainTitles.length + selectedUnmatchedCrawled.length" class="ml-1"></span>개 선택
                </span>
                <div class="flex items-center gap-2">
                    <!-- 수동 그룹 (2개 이상 선택) -->
                    <button x-show="selectedMainTitles.length >= 2"
                        @click="manualGroupTitles()"
                        class="inline-flex items-center px-3 py-1.5 bg-accent text-white rounded-lg text-sm font-medium hover:opacity-90 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z"/>
                        </svg>
                        수동 그룹
                    </button>
                    <!-- 1:1 페어 매칭 -->
                    <button x-show="canPairMatch"
                        @click="pairMatchTitles()"
                        class="inline-flex items-center px-3 py-1.5 bg-purple-600 text-white rounded-lg text-sm font-medium hover:bg-purple-700 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                        1:1 페어
                    </button>
                    <!-- 복구 -->
                    <button x-show="selectedMainTitles.length > 0"
                        @click="restoreSelectedMainTitles()"
                        class="inline-flex items-center px-3 py-1.5 bg-yellow-500 text-white rounded-lg text-sm font-medium hover:bg-yellow-600 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                        </svg>
                        복구
                    </button>
                    <!-- 삭제 -->
                    <button x-show="selectedMainTitles.length > 0"
                        @click="deleteSelectedMainTitles()"
                        class="inline-flex items-center px-3 py-1.5 bg-red-500 text-white rounded-lg text-sm font-medium hover:bg-red-600 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        삭제
                    </button>
                </div>
            </div>
            <!-- 취소 -->
            <button @click="selectedMainTitles = []; selectedUnmatchedCrawled = []"
                class="inline-flex items-center px-3 py-1.5 text-gray-500 hover:text-gray-700 text-sm transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                취소
            </button>
        </div>
    </div>

    <!-- 전체 보기 모드 -->
    <template x-if="mainTitleViewMode === 'all'">
        <div>
            <!-- PC 테이블 -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="w-12">
                                <input type="checkbox" class="rounded border-gray-300"
                                    :checked="mainTitles.length > 0 && selectedMainTitles.length === mainTitles.length"
                                    @click="toggleMainTitleSelectAll()">
                            </th>
                            <th @click="sortMainTitles('title')" class="sortable-header" style="max-width: 400px;">
                                제목
                                <span class="sort-icon" :class="{'active': mainTitleSortField === 'title'}"
                                      x-text="mainTitleSortField === 'title' ? (mainTitleSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                            </th>
                            <th @click="sortMainTitles('category')" class="w-36 sortable-header text-center">
                                카테고리
                                <span class="sort-icon" :class="{'active': mainTitleSortField === 'category'}"
                                      x-text="mainTitleSortField === 'category' ? (mainTitleSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                            </th>
                            <th @click="sortMainTitles('created_at')" class="w-28 sortable-header text-center">
                                등록일
                                <span class="sort-icon" :class="{'active': mainTitleSortField === 'created_at'}"
                                      x-text="mainTitleSortField === 'created_at' ? (mainTitleSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                            </th>
                            <th @click="sortMainTitles('status')" class="w-28 sortable-header text-center whitespace-nowrap">
                                상태
                                <span class="sort-icon" :class="{'active': mainTitleSortField === 'status'}"
                                      x-text="mainTitleSortField === 'status' ? (mainTitleSortDir === 'asc' ? '▲' : '▼') : '▲'"></span>
                            </th>
                            <th class="w-24 text-center">액션</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="mainTitleLoading">
                            <tr>
                                <td colspan="6" class="text-center py-12">
                                    <div class="spinner mx-auto mb-2"></div>
                                    <div class="text-gray-500 text-sm">로딩 중...</div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="!mainTitleLoading && (unifiedTableRows || []).length === 0">
                            <tr>
                                <td colspan="6" class="text-center py-12 text-gray-500">
                                    <div class="text-4xl mb-2">📋</div>
                                    <div>정식 제목이 없습니다</div>
                                    <div class="text-sm mt-1">임시 제목을 이동하여 정식 제목을 추가하세요</div>
                                </td>
                            </tr>
                        </template>
                        <!-- 통합 row: 메인 타이틀과 미매칭 크롤링이 정렬 순서대로 함께 표시 -->
                        <template x-for="row in unifiedTableRows" :key="(row._kind === 'main' ? 'm_' : 'c_') + row.id">
                            <tr :class="
                                row._kind === 'unmatched'
                                  ? (selectedUnmatchedCrawled.includes(row.id) ? 'bg-orange-50' : 'hover:bg-gray-50')
                                  : (selectedMainTitles.includes(row.id) ? 'bg-primary-lt' : '')
                            ">
                                <!-- 체크박스 -->
                                <td class="w-12">
                                    <template x-if="row._kind === 'main'">
                                        <input type="checkbox" class="rounded border-gray-300"
                                               :value="row.id" x-model="selectedMainTitles">
                                    </template>
                                    <template x-if="row._kind === 'unmatched'">
                                        <input type="checkbox" class="rounded border-orange-300 text-orange-600 focus:ring-orange-500"
                                               :value="row.id" x-model="selectedUnmatchedCrawled">
                                    </template>
                                </td>
                                <!-- 제목 -->
                                <td>
                                    <template x-if="row._kind === 'main'">
                                        <div class="flex flex-col gap-1">
                                            <div class="flex items-center gap-2">
                                                <template x-if="row.group_member_count >= 2">
                                                    <button @click="openGroupDetailModal(row.group_id)"
                                                            class="flex items-center gap-1 text-accent hover:opacity-80 cursor-pointer"
                                                            :title="'그룹 보기 (' + row.group_member_count + '개)'">
                                                        <span class="text-lg">📁</span>
                                                        <span class="text-xs text-gray-500" x-text="'(' + row.group_member_count + ')'"></span>
                                                    </button>
                                                </template>
                                                <span class="font-medium truncate max-w-md" x-text="row.title"></span>
                                            </div>
                                            <template x-if="row.matched_crawled_post">
                                                <div class="flex items-center gap-2 pl-2 text-sm text-gray-600">
                                                    <span class="text-gray-400">↳</span>
                                                    <button x-show="row.matched_crawled_post.image_url"
                                                            @click="openImageModal(row.matched_crawled_post.image_url, row.matched_crawled_post.title)"
                                                            class="text-base cursor-pointer hover:scale-125 transition-transform"
                                                            title="클릭하여 이미지 보기">&#x1f5bc;&#xfe0f;</button>
                                                    <span x-show="!row.matched_crawled_post.image_url"
                                                          class="text-base text-gray-300" title="텍스트만">&#x1f4dd;</span>
                                                    <template x-if="row.matched_crawled_post.has_content">
                                                        <button @click="viewGeneratedContent(row.matched_crawled_post.id)"
                                                                class="truncate max-w-sm text-accent hover:opacity-80 hover:underline text-left">
                                                            <span x-text="row.matched_crawled_post.title"></span>
                                                        </button>
                                                    </template>
                                                    <template x-if="!row.matched_crawled_post.has_content">
                                                        <span class="truncate max-w-sm" x-text="row.matched_crawled_post.title"></span>
                                                    </template>
                                                    <span class="text-xs font-medium px-1.5 py-0.5 bg-green-100 text-green-700 rounded"
                                                          x-text="(row.matched_crawled_post.match_score || 100).toFixed(2) + '%'"></span>
                                                    <template x-if="row.matched_crawled_post.url">
                                                        <a :href="row.matched_crawled_post.url" target="_blank"
                                                           class="text-accent hover:opacity-80">
                                                            <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                                            </svg>
                                                        </a>
                                                    </template>
                                                    <template x-if="!row.matched_crawled_post.published_at">
                                                        <button @click="confirmDeleteContent(row.matched_crawled_post.id, row.id, row.matched_crawled_post.title)"

<div
    x-data="{ open: false, title: {}, submitting: false, unmatchSubmitting: false }"

            <div class="px-6 py-4 border-t flex justify-between items-center bg-gray-50">
                <!-- 매칭 해제 버튼 (매칭된 경우에만 표시) -->
                <div>
                    <template x-if="title.matched_crawled_post">
                        <button
                            @click="
                                if (!confirm('이 매칭을 해제하시겠습니까?\\n독립포스트와 미매칭 크롤링 포스트로 분리됩니다.')) return;
                                unmatchSubmitting = true;
                                fetch(`${API_BASE}/titles/main/${title.id}/unmatch`, {
                                    method: 'POST',
                                    credentials: 'include'
                                })
                                .then(res => { if(!res.ok) throw new Error(); return res.json(); })
                                .then(() => {
                                    showSuccessMessage('매칭이 해제되었습니다');
                                    open = false;
                                    loadMainTitlesWithCrawled();
                                })
                                .catch(() => showErrorMessage('매칭 해제 실패'))
                                .finally(() => unmatchSubmitting = false);

                            class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg text-sm disabled:opacity-50">

                            .catch(() => showErrorMessage('저장 실패'))

                        class="px-4 py-2 btn-primary text-white rounded-lg text-sm disabled:opacity-50">
                        <span x-show="!submitting">저장</span>

<div
    x-data="{
        open: false,
        group: {},
        titles: [],
        loading: false,
        expandedTitleId: null,
        async refreshGroupData() {
            if (!this.group.id) return;
            this.loading = true;
            try {
                const res = await fetch(`${API_BASE}/title-groups/${this.group.id}`, { credentials: 'include' });
                if (!res.ok) throw new Error('그룹 조회 실패');
                const data = await res.json();
                this.group = data;
                this.titles = data.titles || [];
            } catch (e) {
                console.error('그룹 새로고침 실패:', e);
            } finally {
                this.loading = false;
            }
        },
        async setRepresentativeAndRefresh(groupId, titleId) {
            try {
                const res = await fetch(`${API_BASE}/title-groups/${groupId}/representative`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ new_representative_id: titleId })
                });
                if (!res.ok) throw new Error('대표 설정 실패');
                showSuccessMessage('대표 제목이 변경되었습니다');
                await this.refreshGroupData();
                loadMainTitles();
            } catch (e) {
                showErrorMessage('대표 설정 실패');
            }
        },
        async removeFromGroupAndRefresh(groupId, titleId) {
            if (!confirm('이 제목을 그룹에서 제외하시겠습니까?')) return;
            this.loading = true;
            try {
                const res = await fetch(`${API_BASE}/titles/groups/${groupId}/remove`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ title_ids: [titleId] })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || '그룹에서 제외 실패');
                }
                const data = await res.json();
                showSuccessMessage(data.message || '그룹에서 제외되었습니다');

                // 그룹이 해제되었으면 모달 닫기
                if (data.group_deleted) {
                    this.open = false;
                    loadMainTitles();
                } else {
                    await this.refreshGroupData();
                    loadMainTitles();
                }
            } catch (e) {
                showErrorMessage(e.message || '그룹에서 제외 실패');
            } finally {
                this.loading = false;
            }
        }
    }"
    @open-group-detail-modal.window="open = true; group = $event.detail; titles = $event.detail.titles || []; expandedTitleId = null"
    x-show="open"
    x-cloak
    class="fixed inset-0 z-50 overflow-y-auto"
    style="background: rgba(0,0,0,0.5)">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div @click.away="open = false" class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[80vh] flex flex-col">
            <!-- 헤더 -->
            <div class="px-4 md:px-6 py-4 border-b flex items-center justify-between flex-shrink-0">
                <div>
                    <h3 class="text-lg font-semibold flex items-center gap-2">
                        <span>📁</span>
                        <span>그룹 상세</span>
                        <span class="text-sm text-gray-500 font-normal" x-text="'(' + titles.length + '개 제목)'"></span>
                    </h3>
                    <p class="text-sm text-gray-500 mt-1 truncate max-w-[280px] md:max-w-none" x-text="group.name"></p>
                </div>
                <button @click="open = false" class="text-gray-400 hover:text-gray-600 p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- 제목 테이블 (PC) -->
            <div class="flex-1 overflow-y-auto hidden md:block relative">
                <!-- 로딩 오버레이 -->
                <div x-show="loading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10">
                    <div class="spinner"></div>
                </div>
                <table class="w-full">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">제목</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase w-24">유사도</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase w-24">상태</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase w-32">액션</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <template x-for="title in titles" :key="title.id">
                            <tr :class="{'bg-amber-50': title.is_group_representative}">
                                <td class="px-4 py-3">
                                    <div class="flex items-center gap-2">
                                        <span x-show="title.is_group_representative"
                                              class="text-xs text-amber-600 font-medium px-1.5 py-0.5 bg-amber-100 rounded flex-shrink-0">대표</span>
                                        <span class="text-sm" x-text="title.title"></span>
                                    </div>
                                </td>
                                <td class="px-4 py-3 text-center">
                                    <template x-if="!title.is_group_representative && title.similarity_score">
                                        <span class="text-sm text-gray-600" x-text="Math.round(title.similarity_score) + '%'"></span>
                                    </template>
                                    <template x-if="title.is_group_representative || !title.similarity_score">
                                        <span class="text-xs text-gray-400">-</span>
                                    </template>
                                </td>
                                <td class="px-4 py-3 text-center">
                                    <span :class="{
                                        'bg-green-100 text-green-800': title.status === 'available',
                                        'bg-accent-lt text-accent': title.status === 'matched',
                                        'bg-gray-100 text-gray-800': title.status === 'used',
                                        'bg-yellow-100 text-yellow-800': title.status === 'archived'
                                    }" class="px-2 py-0.5 rounded text-xs" x-text="getMainTitleStatusText(title.status)"></span>
                                </td>
                                <td class="px-4 py-3 text-center">
                                    <div class="flex items-center justify-center gap-2">
                                        <button x-show="!title.is_group_representative"
                                                @click="setRepresentativeAndRefresh(group.id, title.id)"
                                                class="text-xs text-accent hover:underline">
                                            대표로
                                        </button>
                                        <button x-show="!title.is_group_representative"
                                                @click="removeFromGroupAndRefresh(group.id, title.id)"
                                                class="text-xs text-red-500 hover:underline">
                                            제외
                                        </button>
                                        <span x-show="title.is_group_representative" class="text-xs text-amber-700 font-medium">대표 제목</span>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- 제목 카드 리스트 (모바일) -->
            <div class="flex-1 overflow-y-auto md:hidden relative">
                <!-- 로딩 오버레이 -->
                <div x-show="loading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10">
                    <div class="spinner"></div>
                </div>
                <div class="p-3 space-y-2">
                    <template x-for="title in titles" :key="title.id">
                        <div class="border rounded-lg overflow-hidden"
                             :class="{'border-amber-300 bg-amber-50': title.is_group_representative, 'border-gray-200 bg-white': !title.is_group_representative}">
                            <!-- 카드 헤더 (아코디언 토글) -->
                            <div class="p-3 flex items-start gap-3 cursor-pointer"
                                 @click="expandedTitleId = expandedTitleId === title.id ? null : title.id">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span x-show="title.is_group_representative"
                                              class="text-xs text-amber-600 font-medium px-1.5 py-0.5 bg-amber-100 rounded flex-shrink-0">대표</span>
                                        <span :class="{
                                            'bg-green-100 text-green-800': title.status === 'available',
                                            'bg-accent-lt text-accent': title.status === 'matched',
                                            'bg-gray-100 text-gray-800': title.status === 'used',
                                            'bg-yellow-100 text-yellow-800': title.status === 'archived'
                                        }" class="px-2 py-0.5 rounded text-xs" x-text="getMainTitleStatusText(title.status)"></span>
                                        <template x-if="!title.is_group_representative && title.similarity_score">
                                            <span class="text-xs text-gray-500" x-text="'유사도: ' + Math.round(title.similarity_score) + '%'"></span>
                                        </template>
                                    </div>
                                    <p class="text-sm text-gray-800 leading-snug"
                                       :class="{'line-clamp-2': expandedTitleId !== title.id}"
                                       x-text="title.title"></p>
                                </div>
                                <svg class="w-5 h-5 text-gray-400 flex-shrink-0 transition-transform"
                                     :class="{'rotate-180': expandedTitleId === title.id}"
                                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </div>
                            <!-- 카드 확장 (아코디언 컨텐츠) -->
                            <div x-show="expandedTitleId === title.id" x-transition
                                 class="px-3 pb-3 pt-0 border-t border-gray-100">
                                <div class="flex items-center justify-between pt-3">
                                    <div class="text-xs text-gray-500">
                                        <template x-if="!title.is_group_representative && title.similarity_score">
                                            <span x-text="'대표 제목과 ' + Math.round(title.similarity_score) + '% 유사'"></span>
                                        </template>
                                        <template x-if="title.is_group_representative">
                                            <span class="text-amber-600 font-medium">그룹 대표 제목</span>
                                        </template>
                                    </div>
                                    <div class="flex gap-2" x-show="!title.is_group_representative">
                                        <button @click.stop="setRepresentativeAndRefresh(group.id, title.id)"
                                                class="px-3 py-1.5 text-xs text-white bg-primary hover:opacity-90 rounded-lg transition-colors">
                                            대표로
                                        </button>
                                        <button @click.stop="removeFromGroupAndRefresh(group.id, title.id)"
                                                class="px-3 py-1.5 text-xs text-white bg-red-500 hover:bg-red-600 rounded-lg transition-colors">
                                            제외
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 푸터 -->
            <div class="px-4 md:px-6 py-4 border-t flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-gray-50 flex-shrink-0">
                <div class="text-sm text-gray-500 flex flex-wrap gap-2">
                    <span x-show="group.location" x-text="'📍 ' + group.location"></span>
                    <span x-show="group.category_name" x-text="'🏷️ ' + group.category_name"></span>
                </div>
                <button @click="open = false"
                        class="w-full md:w-auto px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm">
                    닫기
                </button>
            </div>
        </div>
    </div>
</div>
