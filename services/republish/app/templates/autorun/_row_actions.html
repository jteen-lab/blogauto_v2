{#
  오토런 행 액션 — 카드(_card.html) 헤더 버튼을 그대로 옮긴 것.

  일시정지는 실행중일 때만, 재개는 정지 상태일 때만 나온다. 카드의
  x-if 조건을 그대로 유지한다 — 상태와 맞지 않는 버튼을 누르면 API 가
  거절하고 사용자는 이유를 모른다.
#}
<div class="inline-flex items-center gap-0.5">
  <template x-if="flow.status === 'active'">
    <button type="button" @click="pauseFlow(flow.id)"
            class="p-1.5 text-yellow-600 hover:text-yellow-800 hover:bg-yellow-100 rounded-lg transition-colors"
            title="일시정지">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
    </button>
  </template>

  <template x-if="flow.status === 'paused'">
    <button type="button" @click="resumeFlow(flow.id)"
            class="p-1.5 text-green-600 hover:text-green-800 hover:bg-green-100 rounded-lg transition-colors"
            title="재개">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
      </svg>
    </button>
  </template>

  <button type="button" @click="removeFlow(flow.id)"
          class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
          title="오토런에서 제외">
    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"/>
    </svg>
  </button>
</div>
