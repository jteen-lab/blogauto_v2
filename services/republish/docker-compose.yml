# Phase 1-1: BlogAuto V2 Docker Compose (개발/프로덕션 공통)
# Phase G-1: Redis + Celery 워커 추가
# Phase 1-C: 4워커 체계 (generation, publish, image, utility)
version: '3.8'

services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: blogauto_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blogauto}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-blogauto123}
      - POSTGRES_DB=${POSTGRES_DB:-blogauto_v2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs:/app/logs
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blogauto}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blogauto_network

  # Redis (Celery Broker)
  redis:
    image: redis:7-alpine
    container_name: blogauto_redis
    # 외부 포트 노출 제거 - 도커 내부 네트워크로만 접근 (cryptojacking 방지).
    # 호스트에서 직접 redis-cli 사용은 `docker exec blogauto_redis redis-cli` 사용.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    # 보안 강화 (cryptojacking 공격 핵심 명령만 비활성화):
    #   --rename-command CONFIG "" : dir/dbfilename 변조 방지 (RDB 경로 변조 차단)
    #   --rename-command SLAVEOF "" : 악성 master 강제 동기화 차단
    #   --rename-command REPLICAOF "" : SLAVEOF 신규 alias도 차단
    #   --rename-command MODULE "" : Redis Module 로드를 통한 RCE 차단
    #
    # protected-mode no: 도커 네트워크 내부의 다른 IP(앱/워커)에서 접근 가능하게.
    # 외부 노출은 expose 6379 (호스트 외부 미공개)로 이미 차단되어 안전.
    # FLUSHALL/FLUSHDB는 비활성화 안 함 - AOF 재생 호환성 유지.
    command: >
      redis-server --appendonly yes
      --protected-mode no
      --rename-command CONFIG ""
      --rename-command SLAVEOF ""
      --rename-command REPLICAOF ""
      --rename-command MODULE ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blogauto_network

  # FastAPI 애플리케이션
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_app
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long}
      - DATABASE_URL=${DATABASE_URL:-postgresql://blogauto:blogauto123@db:5432/blogauto_v2}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./media:/app/media
      - ../../shared:/app/shared
      - ./.env:/app/.env:ro
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - blogauto_network

  # Celery 워커 - 글 생성 (generation_queue)
  celery_generation_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_celery_generation
    command: celery -A app.core.celery_config worker -Q generation_queue --autoscale=8,3 --prefetch-multiplier=1 --max-tasks-per-child=50 -l INFO -n generation@%h
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://blogauto:blogauto123@db:5432/blogauto_v2}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./media:/app/media
      - ../../shared:/app/shared
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - blogauto_network

  # Celery 워커 - 발행/재발행 (publish_queue)
  celery_publish_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_celery_publish
    command: celery -A app.core.celery_config worker -Q publish_queue --autoscale=5,2 --prefetch-multiplier=1 --max-tasks-per-child=100 -l INFO -n publish@%h
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://blogauto:blogauto123@db:5432/blogauto_v2}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./media:/app/media
      - ../../shared:/app/shared
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - blogauto_network

  # Celery 워커 - 이미지 생성 (image_queue)
  celery_image_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_celery_image
    command: celery -A app.core.celery_config worker -Q image_queue --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=50 -l INFO -n image@%h
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://blogauto:blogauto123@db:5432/blogauto_v2}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./media:/app/media
      - ../../shared:/app/shared
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - blogauto_network

  # Celery 워커 - 수집/데이터 처리 (utility_queue)
  celery_utility_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_celery_utility
    command: celery -A app.core.celery_config worker -Q utility_queue,callback_queue --concurrency=2 --prefetch-multiplier=2 --max-tasks-per-child=200 -l INFO -n utility@%h
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://blogauto:blogauto123@db:5432/blogauto_v2}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./media:/app/media
      - ../../shared:/app/shared
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - blogauto_network

  # Flower (Celery 모니터링)
  celery_flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blogauto_celery_flower
    command: >
      celery -A app.core.celery_config flower
      --port=5555
      --persistent=True
      --state_save_interval=30000
      --inspect_timeout=10000
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - FLOWER_UNAUTHENTICATED_API=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - blogauto_network

networks:
  blogauto_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
